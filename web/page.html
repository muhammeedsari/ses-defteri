<title>Ses Defteri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one phone column. Recordings and music tabs, a floating record key, full-screen sheets for the studio recorder, the player with a scrolling waveform, and the cut editor. */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface-2:#E2E8E4; --ink:#16201C; --muted:#56645E; --line:#D2DAD5;
  --accent:#1D6E5A; --accent-ink:#FFFFFF; --accent-soft:#D6EAE3;
  --rec:#CF2A39; --rec-soft:#F8DDE0; --mark:#A86F00; --mark-soft:#F5E6C3; --on-mark:#1E1500; --wave:#B3C1BA;
  --scrim:rgb(6 12 10 / .5);
  --shadow:0 1px 2px rgb(16 32 26 / .06), 0 10px 28px rgb(16 32 26 / .10);
  --stage:#111C18; --stage-2:#1A2722; --stage-ink:#E8EFEB; --stage-muted:#8EA197; --stage-line:#2A3a34; --stage-rec:#FF5A68; --stage-mark:#F2B83D;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1412; --surface:#171E1B; --surface-2:#212A26; --ink:#E4EBE7; --muted:#93A39C; --line:#2A3531;
    --accent:#52BC9F; --accent-ink:#06130F; --accent-soft:#183A30;
    --rec:#FF5A68; --rec-soft:#3D1B20; --mark:#F0B53A; --mark-soft:#3A2F14; --on-mark:#1E1500; --wave:#3A4843;
    --scrim:rgb(0 0 0 / .6);
    --shadow:0 1px 2px rgb(0 0 0 / .3), 0 10px 28px rgb(0 0 0 / .4);
    --stage:#0A100E; --stage-2:#141C19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171E1B; --surface-2:#212A26; --ink:#E4EBE7; --muted:#93A39C; --line:#2A3531;
  --accent:#52BC9F; --accent-ink:#06130F; --accent-soft:#183A30;
  --rec:#FF5A68; --rec-soft:#3D1B20; --mark:#F0B53A; --mark-soft:#3A2F14; --on-mark:#1E1500; --wave:#3A4843;
  --scrim:rgb(0 0 0 / .6);
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 10px 28px rgb(0 0 0 / .4);
  --stage:#0A100E; --stage-2:#141C19;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0;
  -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-appearance:none;appearance:none}
button:disabled{cursor:default;opacity:.38}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.ic{width:20px;height:20px;flex:none;display:block}
.tc{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
.spacer{flex:1}

.wrap{max-width:640px;margin:0 auto;padding-bottom:150px}
body.has-mini .wrap,body.has-mini #coll .sheet-inner{padding-bottom:240px}

/* header */
.top{display:flex;align-items:center;gap:10px;padding-block:20px 6px}
.top .btn{padding:0 14px}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.logo svg{width:28px;height:28px}
h1{font-family:var(--f-display);font-weight:700;font-size:27px;letter-spacing:-.025em;margin:0;line-height:1.05}
.sum{margin:3px 0 0;color:var(--muted);font-size:12px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:4px;margin-top:12px;background:var(--surface-2);border-radius:12px;padding:4px}
.tabs button{flex:1;height:38px;border-radius:9px;font-weight:600;font-size:14.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.tabs .ic{width:18px;height:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--rec)}
.btn.danger-fill{background:var(--rec);color:#fff;border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn .ic{width:18px;height:18px}
.icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--surface-2)}

.notice{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:12px;padding:12px 8px 12px 14px;font-size:13.5px;line-height:1.45;margin-top:10px}
.notice p{margin:0;flex:1;min-width:0}
.notice b{font-weight:600}
.notice .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.notice .icon-btn{width:32px;height:32px;margin-top:-4px}
.notice .ic{width:16px;height:16px}

/* toolbar */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:grid;gap:10px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 6px 0 12px;height:46px;color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--ink);font-size:16px;height:100%}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;white-space:nowrap}
.chip .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip .ic{width:15px;height:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.chip.ghost{background:transparent;border-style:dashed;color:var(--muted)}
.listbar{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;min-height:28px;gap:8px}
.sort{border:0;background:transparent;color:var(--muted);font-size:16px;padding:4px 0;text-align:right}

/* recordings list */
.day{margin-top:14px}
.day h3{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px 4px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rec{display:flex;align-items:stretch}
.rec+.rec{border-top:1px solid var(--line)}
.rec.playing .rec-title{color:var(--accent)}
.rec-open{flex:1;min-width:0;text-align:left;padding:13px 2px 12px 16px;display:grid;gap:5px}
.rec-open:active{background:var(--surface-2)}
.rec-top{display:flex;align-items:center;gap:8px;min-width:0}
.rec-title{font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rec-sub{display:flex;flex-wrap:wrap;align-items:center;gap:3px 12px;color:var(--muted);font-size:12.5px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.rec-sub .catlab,.rec-sub .src{font-family:var(--f-body);display:inline-flex;align-items:center;gap:6px}
.rec-sub .src .ic{width:13px;height:13px}
.rec-sub .catlab i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.bmc{display:inline-flex;align-items:center;gap:3px;color:var(--mark)}
.bmc .ic{width:13px;height:13px}
.hit{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit mark{background:var(--mark-soft);color:var(--ink);border-radius:3px;padding:0 2px}
.mini-wave{display:block;width:100%;height:20px;margin-top:2px}
.fav-btn{width:50px;display:grid;place-items:center;color:var(--muted);flex:none}
.fav-btn.on{color:var(--mark)}
.pill{flex:none;font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--mark-soft);color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:48px 12px 24px;max-width:36ch;margin:0 auto}
.empty .ic{width:36px;height:36px;margin:0 auto 12px;color:var(--wave)}
.empty b{display:block;color:var(--ink);font-weight:600;font-size:16px;margin-bottom:4px}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:28px}

/* music */
.songs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:6px}
.song{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 12px 9px 10px}
.song+.song{border-top:1px solid var(--line)}
.song:active{background:var(--surface-2)}
.art{position:relative;width:46px;height:46px;border-radius:9px;flex:none;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--muted);overflow:hidden}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.art .ic{width:22px;height:22px}
.song-txt{flex:1;min-width:0;display:grid;gap:1px}
.song-txt b{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song-txt span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song .dur{font-size:12.5px;color:var(--muted);flex:none}
.song.on b{color:var(--accent)}
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 12px;margin-top:8px}
.album{text-align:left;display:grid;gap:6px;min-width:0}
.album .art{width:100%;height:auto;aspect-ratio:1;border-radius:12px;font-size:34px;max-width:100%}
.album b{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.album span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:-4px}
.music-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.perm{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px;text-align:center;margin-top:12px}
.perm .ic{width:34px;height:34px;margin:0 auto 10px;color:var(--accent)}
.perm b{display:block;font-size:16px;margin-bottom:4px}
.perm p{margin:0 auto 14px;color:var(--muted);max-width:34ch;font-size:14px}
.more{display:flex;margin:14px auto 0}
.coll-head{display:flex;gap:16px;align-items:center;margin-top:6px}
.coll-head .art{width:104px;height:104px;border-radius:14px;font-size:40px}
.coll-head .art .ic{width:40px;height:40px}
.coll-head h2{font-family:var(--f-display);font-size:24px;line-height:1.15;margin:0;letter-spacing:-.015em;overflow-wrap:anywhere}
.coll-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;pointer-events:none;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px));display:grid;justify-items:center;gap:12px}
.dock>*{pointer-events:auto}
.fab{width:74px;height:74px;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab span{width:32px;height:32px;border-radius:50%;background:var(--rec)}
.mini{width:100%;max-width:608px;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px}
.mini .icon-btn{width:42px;height:42px}
.mini .play-s{background:var(--accent);color:var(--accent-ink)}
.mini .art{width:42px;height:42px;font-size:16px}
.mini-info{flex:1;min-width:0;text-align:left;display:grid;padding:2px 4px}
.mini-info b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-info span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-bar{height:3px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.mini-bar i{display:block;height:100%;width:0;background:var(--accent)}

/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  transform:translateY(28px);opacity:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .22s}
.sheet.open{transform:none;opacity:1}
.sheet-inner{max-width:640px;margin:0 auto;padding-bottom:36px}
.sheet-head{display:flex;align-items:center;gap:6px;padding-block:10px 4px;margin-left:-10px;margin-right:-10px}
.sheet-head h2{font-family:var(--f-display);font-size:19px;margin:0;font-weight:700}
#coll{z-index:14}
#coll .sheet-inner{padding-bottom:180px}
#editor{z-index:25}

/* recorder */
.rec-sheet{z-index:30;background:var(--stage);color:var(--stage-ink);display:flex;flex-direction:column}
.rec-sheet .sheet-inner{flex:1;display:flex;flex-direction:column;width:100%;padding-bottom:20px}
.rec-sheet .icon-btn:hover{background:var(--stage-2)}
.seg{display:inline-flex;border:1px solid var(--stage-line);border-radius:999px;padding:3px;gap:2px;background:var(--stage-2)}
.seg button{height:34px;padding:0 18px;border-radius:999px;font-size:14px;font-weight:500;color:var(--stage-muted)}
.seg button[aria-checked="true"]{background:var(--stage-ink);color:var(--stage)}
.mode-hint{margin:12px auto 0;max-width:34ch;text-align:center;color:var(--stage-muted);font-size:13px;min-height:2.9em}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding-block:18px;min-height:300px}
.rec-state{display:inline-flex;align-items:center;gap:9px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--stage-muted);font-weight:600}
.led{width:9px;height:9px;border-radius:50%;background:var(--stage-line)}
.rec-sheet[data-state="rec"] .led{background:var(--stage-rec);box-shadow:0 0 12px var(--stage-rec);animation:blink 1.3s ease-in-out infinite}
.rec-sheet[data-state="paused"] .led{background:var(--stage-mark)}
@keyframes blink{50%{opacity:.35}}
.timecode{font-family:var(--f-mono);font-size:clamp(54px,17vw,80px);font-weight:400;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.timecode small{font-size:.42em;color:var(--stage-muted);letter-spacing:0}
.meter{display:flex;gap:14px;align-items:center;font-family:var(--f-mono);font-size:12.5px;color:var(--stage-muted);font-variant-numeric:tabular-nums}
.meter .clip{color:var(--stage-rec);font-weight:500}
.meter .mk{color:var(--stage-mark);display:inline-flex;align-items:center;gap:4px}
.meter .mk .ic{width:13px;height:13px}
.live{width:100%;height:150px;display:block}
.rec-controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:8px}
.ctl-s{display:grid;justify-items:center;gap:6px;font-size:12.5px;color:var(--stage-muted)}
.ctl-s .rnd{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--stage-2);border:1px solid var(--stage-line);color:var(--stage-ink)}
.ctl-s.mk .rnd{color:var(--stage-mark)}
.rec-main{width:88px;height:88px;border-radius:50%;border:3px solid var(--stage-ink);display:grid;place-items:center;color:var(--stage-rec);transition:transform .15s}
.rec-main:active{transform:scale(.95)}
.rec-main .dot{width:64px;height:64px;border-radius:50%;background:var(--stage-rec)}
.rec-main .ic{width:34px;height:34px}
.rec-foot{text-align:center;color:var(--stage-muted);font-size:12.5px;margin:10px 0 0}

/* player */
.pl-id{display:flex;gap:14px;align-items:center;min-width:0}
.pl-id .art{width:64px;height:64px;border-radius:12px;font-size:24px}
.pl-id-txt{flex:1;min-width:0}
.pl-title{width:100%;font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.15;letter-spacing:-.02em;border:0;background:transparent;padding:6px 0 4px;border-bottom:1px dashed transparent;border-radius:0}
.pl-title:focus{outline:none;border-bottom-color:var(--muted)}
.pl-meta{color:var(--muted);font-size:12.5px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:2px 12px}
.pl-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.cat-pick{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:0 4px 0 12px;height:38px;background:var(--surface);max-width:100%}
.cat-pick i{width:9px;height:9px;border-radius:50%;background:var(--c, var(--wave));flex:none}
.cat-pick select{border:0;background:transparent;font-size:16px;padding:0 6px 0 0;min-width:0;max-width:60vw}
.clock{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:clamp(44px,13vw,58px);letter-spacing:-.03em;text-align:center;margin-top:18px;line-height:1}
.clock small{font-size:.5em;color:var(--muted);letter-spacing:0}
.scroll-box{position:relative;margin-top:14px;margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)))}
.scroll-wave{width:100%;height:210px;display:block;touch-action:pan-y;cursor:grab}
.zoom{position:absolute;right:max(12px, env(safe-area-inset-right, 0px));top:4px;display:flex;gap:4px}
.zoom button{width:32px;height:32px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-mono);font-size:16px;color:var(--muted)}
.wave-status{position:absolute;left:0;right:0;top:50%;transform:translateY(-70%);text-align:center;font-size:13px;color:var(--muted);pointer-events:none}
.overview{width:100%;height:30px;display:block;margin-top:14px;touch-action:none;cursor:pointer}
.pl-times{display:flex;justify-content:space-between;margin-top:6px;font-size:12.5px;color:var(--muted)}
.transport{display:flex;justify-content:center;align-items:center;margin-top:16px;gap:14px}
.play{width:76px;height:76px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.play .ic{width:30px;height:30px}
.ctl{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.ctl .ic{width:24px;height:24px}
.ctl.ghost{background:transparent;border-color:transparent}
.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:16px}
.tool{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500}
.tool .ic{width:17px;height:17px}
.tool.mark{color:var(--mark)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tool .tc{font-size:13px}
.block{margin-top:30px}
.block h2{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
.block h2 .n{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-weight:400}
.hint{color:var(--muted);font-size:14px;margin:0;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px}
.bms{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bm{display:flex;align-items:flex-start}
.bm+.bm{border-top:1px solid var(--line)}
.bm-time{flex:none;margin:11px 0 11px 12px;padding:5px 9px;border-radius:8px;background:var(--mark-soft);color:var(--ink);font-size:13px}
.bm.now .bm-time{background:var(--mark);color:var(--on-mark)}
.bm-body{flex:1;min-width:0;text-align:left;padding:12px 14px 12px 12px;display:grid;gap:2px}
.bm-label{font-weight:600;overflow-wrap:anywhere}
.bm-note{color:var(--muted);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
textarea,.field input{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:11px 14px;font-size:16px;line-height:1.5;color:var(--ink)}
textarea{resize:vertical;min-height:110px}
textarea:focus,.field input:focus{outline:none;border-color:var(--accent)}
.saved{font-size:12px;color:var(--muted);margin:6px 2px 0;min-height:1.2em}
.pl-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.where{font-size:12.5px;color:var(--muted);margin-top:10px;overflow-wrap:anywhere}

/* editor */
.ed-sum{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);margin:4px 0 0}
.ed-sum b{color:var(--ink);font-weight:500}
.ed-sum .cut{color:var(--rec)}
.ed-wave{width:100%;height:180px;display:block;margin-top:14px;touch-action:none;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.ed-nav{width:100%;height:34px;display:block;margin-top:8px;touch-action:none;border-radius:8px;background:var(--surface-2)}
.ed-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.ed-row .tc{font-size:13px;color:var(--muted)}
.ed-sel{font-family:var(--f-mono);font-size:13px;margin-top:10px;color:var(--muted)}
.ed-sel b{color:var(--ink);font-weight:500}
.ed-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:16px;display:grid;gap:10px}
.ed-card h3{margin:0;font-size:15px;font-weight:600}
.ed-card p{margin:0;font-size:13.5px;color:var(--muted)}
.slider{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.slider input{width:100%;min-width:0;accent-color:var(--accent)}
.slider .tc{min-width:6ch;text-align:right;font-size:13px}
.choice{display:grid;gap:10px;margin-top:12px}
.choice button{text-align:left;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--bg);display:grid;gap:3px}
.choice button b{font-weight:600}
.choice button span{font-size:13.5px;color:var(--muted)}
.prog{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

/* modal */
.modal{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.modal.open{opacity:1}
.modal-card{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;
  padding:22px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  transform:translateY(20px);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow)}
.modal.open .modal-card{transform:none}
@media (min-width:640px){.modal{align-items:center;padding:24px}.modal-card{border-radius:22px;padding-bottom:20px}}
.modal-card h3{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.01em;margin:0 0 6px}
.mtext{color:var(--muted);margin:0 0 4px}
.modal-body{display:grid;gap:14px;margin-top:10px}
.field{display:grid;gap:6px}
.field>span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.modal-actions{display:flex;gap:8px;align-items:center;margin-top:20px;flex-wrap:wrap}
.tadj{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tadj .tc{font-size:22px;min-width:5.2ch;text-align:center}
.tadj .btn{min-height:38px;padding:0 12px;font-family:var(--f-mono);font-size:13px}
.linkbtn{color:var(--accent);font-weight:500;font-size:14px;text-align:left;padding:4px 0}
.catlist{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
.catrow{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:6px 6px 6px 10px}
.catrow input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:8px 4px;color:var(--ink)}
.catrow input:focus{outline:none}
.catrow .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.catrow.confirm{background:var(--mark-soft);flex-wrap:wrap;padding:10px 10px 10px 14px}
.catrow.confirm p{margin:0;flex:1 1 180px;font-size:14px}
.sw{width:26px;height:26px;border-radius:50%;background:var(--c);flex:none;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches button[aria-checked="true"]{box-shadow:0 0 0 2px var(--ink)}
.newcat{display:grid;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.newcat .row{display:flex;gap:8px}
.newcat input{flex:1;min-width:0}
.copybox{width:100%;min-height:200px;font-family:var(--f-mono);font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;width:max-content;max-width:calc(100% - 32px);box-shadow:var(--shadow);text-align:center}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

/* accent colours (settings) */
:root[data-accent="blue"]{--accent:#2058A8;--accent-ink:#FFFFFF;--accent-soft:#DCE6F5}
:root[data-accent="violet"]{--accent:#6A45B0;--accent-ink:#FFFFFF;--accent-soft:#E7DFF5}
:root[data-accent="amber"]{--accent:#A4560F;--accent-ink:#FFFFFF;--accent-soft:#F5E3CF}
:root[data-accent="rose"]{--accent:#AE325C;--accent-ink:#FFFFFF;--accent-soft:#F5DCE5}
@media (prefers-color-scheme: dark){
  :root[data-accent="blue"]:not([data-theme="light"]){--accent:#7AA9F0;--accent-ink:#071223;--accent-soft:#1B2B45}

}

:root[data-accent="violet"][data-theme="dark"]{--accent:#B497F0;--accent-ink:#140A26;--accent-soft:#2C2244}
:root[data-accent="amber"][data-theme="dark"]{--accent:#F0A45A;--accent-ink:#1F1206;--accent-soft:#3A2814}
:root[data-accent="rose"][data-theme="dark"]{--accent:#F08AAE;--accent-ink:#24060F;--accent-soft:#3D1A28}

/* 3.5: the whole page takes the colour (backgrounds, lines, grey text), not only the buttons */
:root[data-accent="blue"]{--bg:#EDEFF1;--surface-2:#E2E4E8;--ink:#161A20;--muted:#565C64;--line:#D2D5DA;--wave:#B3B9C1;--stage:#11151C;--stage-2:#1A1F27;--stage-muted:#8E96A1;--stage-line:#2A303A}
:root[data-accent="violet"]{--bg:#EFEDF1;--surface-2:#E4E2E8;--ink:#1A1620;--muted:#5C5664;--line:#D5D2DA;--wave:#B9B3C1;--stage:#16111C;--stage-2:#1F1A27;--stage-muted:#968EA1;--stage-line:#312A3A}
:root[data-accent="amber"]{--bg:#F1EFED;--surface-2:#E8E5E2;--ink:#201B16;--muted:#645D56;--line:#DAD6D2;--wave:#C1BAB3;--stage:#1C1611;--stage-2:#27201A;--stage-muted:#A1988E;--stage-line:#3A322A}
:root[data-accent="rose"]{--bg:#F1EDEE;--surface-2:#E8E2E4;--ink:#20161A;--muted:#64565B;--line:#DAD2D5;--wave:#C1B3B8;--stage:#1C1115;--stage-2:#271A1F;--stage-muted:#A18E95;--stage-line:#3A2A30}
@media (prefers-color-scheme: dark){
  :root[data-accent="blue"]:not([data-theme="light"]){--bg:#0F1114;--surface:#171A1E;--surface-2:#21252A;--ink:#E4E7EB;--muted:#9399A3;--line:#2A2E35;--wave:#3A4048;--stage:#0A0C10;--stage-2:#14171C}
  :root[data-accent="violet"]:not([data-theme="light"]){--bg:#110F14;--surface:#1A171E;--surface-2:#25212A;--ink:#E7E4EB;--muted:#9A93A3;--line:#2F2A35;--wave:#403A48;--stage:#0C0A10;--stage-2:#17141C}
  :root[data-accent="amber"]:not([data-theme="light"]){--bg:#14120F;--surface:#1E1A17;--surface-2:#2A2621;--ink:#EBE8E4;--muted:#A39B93;--line:#35302A;--wave:#48413A;--stage:#100D0A;--stage-2:#1C1814}

}
:root[data-accent="blue"][data-theme="dark"]{--bg:#0F1114;--surface:#171A1E;--surface-2:#21252A;--ink:#E4E7EB;--muted:#9399A3;--line:#2A2E35;--wave:#3A4048;--stage:#0A0C10;--stage-2:#14171C}
:root[data-accent="violet"][data-theme="dark"]{--bg:#110F14;--surface:#1A171E;--surface-2:#25212A;--ink:#E7E4EB;--muted:#9A93A3;--line:#2F2A35;--wave:#403A48;--stage:#0C0A10;--stage-2:#17141C}
:root[data-accent="amber"][data-theme="dark"]{--bg:#14120F;--surface:#1E1A17;--surface-2:#2A2621;--ink:#EBE8E4;--muted:#A39B93;--line:#35302A;--wave:#48413A;--stage:#100D0A;--stage-2:#1C1814}
:root[data-accent="rose"][data-theme="dark"]{--bg:#140F11;--surface:#1E171A;--surface-2:#2A2124;--ink:#EBE4E7;--muted:#A39399;--line:#352A2E;--wave:#483A3F;--stage:#100A0C;--stage-2:#1C1417}

/* waveform progress sits in a corner so the growing waveform stays visible */
.wave-status{position:absolute;left:max(16px, env(safe-area-inset-left, 0px));right:auto;top:6px;transform:none;text-align:start;font-size:12px;color:var(--muted);pointer-events:none;background:var(--bg);padding:2px 8px;border-radius:8px;font-family:var(--f-mono)}

/* settings */
.set-sec{display:grid;gap:10px;margin-top:20px}
.set-sec>h4{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.langs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.langs button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:15px;font-weight:500;text-align:start;padding:0 14px}
.langs button[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.seg2{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg2 button{flex:1;height:40px;border-radius:9px;font-weight:500;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg2 button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.accents{display:flex;gap:12px;flex-wrap:wrap}
.accents button{display:grid;justify-items:center;gap:6px;font-size:12px;color:var(--muted)}
.accents i{width:38px;height:38px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);display:block}
.accents button[aria-checked="true"] i{box-shadow:0 0 0 2px var(--ink)}
.accents button[aria-checked="true"]{color:var(--ink)}
.switch{display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0 / .25);transition:transform .15s}
.switch input:checked{background:var(--accent);border-color:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}
.switch span{display:grid;gap:2px;font-size:14.5px}
.switch small{color:var(--muted);font-size:13px}
.about{color:var(--muted);font-size:12.5px;margin-top:22px;text-align:center;font-family:var(--f-mono)}

/* right-to-left (Arabic): media stays left-to-right, arrows flip */
[dir="rtl"] .tc,[dir="rtl"] .clock,[dir="rtl"] .timecode,[dir="rtl"] .meter,[dir="rtl"] .ed-sum,[dir="rtl"] .ed-sel b{direction:ltr;unicode-bidi:isolate}
[dir="rtl"] .transport,[dir="rtl"] .rec-controls,[dir="rtl"] .mini-bar,[dir="rtl"] .pl-times{direction:ltr}
[dir="rtl"] #plBack svg,[dir="rtl"] #collBack svg{transform:scaleX(-1)}
[dir="rtl"] .rec-open,[dir="rtl"] .song,[dir="rtl"] .mini-info,[dir="rtl"] .bm-body,[dir="rtl"] .album,[dir="rtl"] .choice button{text-align:right}
[dir="rtl"] .sort{text-align:left}
h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum span,.pl-meta span,.rec-sub span{unicode-bidi:plaintext}
[dir="rtl"] .zoom{direction:ltr}
@media (max-width:440px){
  #importBtn{width:44px;height:44px;padding:0;justify-content:center;border-color:transparent;background:transparent;box-shadow:none}
  #importBtn [data-t]{display:none}
}
.sum span{white-space:nowrap}

/* studio */
.studio .st-card{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px;background:var(--surface)}
.studio .st-card+.st-card{margin-top:10px}
.st-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.st-head .ic{color:var(--accent)}
.st-head b{font-weight:600;flex:1;min-width:0}
.st-chips{display:flex;flex-wrap:wrap;gap:6px}
.st-chips span{font-size:12.5px;padding:4px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.st-desc{margin:0;color:var(--muted);font-size:13.5px}
.st-acts{display:flex;flex-wrap:wrap;gap:8px}
.st-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.switch.mini{gap:8px;font-size:13px;align-items:center}
.switch.mini input{width:38px;height:22px}
.switch.mini input::after{width:16px;height:16px}
.switch.mini input:checked::after{transform:translateX(16px)}
.set-sub{display:grid;gap:6px;font-size:14px}
.enh-dot{color:var(--accent);display:inline-flex}
.enh-dot .ic{width:14px;height:14px}
.busy-pill{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-family:var(--f-mono)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--accent)}
.segs{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:2px;max-height:340px;overflow:auto}
.segs li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:6px 4px;border-radius:10px;font-size:14.5px;line-height:1.45}
.segs li.now{background:var(--accent-soft)}
.segs .bm-time{font-size:12px;padding-top:2px}
.mix-list{display:grid;gap:4px;max-height:240px;overflow:auto;margin:10px 0}
.mix-song{display:grid;text-align:start;padding:8px 10px;border-radius:10px;border:1px solid transparent;background:var(--surface-2)}
.mix-song b{font-weight:500;font-size:14.5px}
.mix-song span{font-size:12.5px;color:var(--muted)}
.mix-song.on{border-color:var(--accent);background:var(--accent-soft)}
[dir="rtl"] .mix-song{text-align:right}
.sel-full{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;font-size:16px}

/* edit sound tab */
#editTab{padding-bottom:24px}
.ws-intro{margin:16px 0 12px}
.ws-intro b{font-size:17px}
.ws-intro p{margin:6px 0 0;color:var(--muted);font-size:14px}
.ws-list{margin-top:12px}
.ws-head{display:flex;align-items:center;gap:10px;margin-top:14px}
.ws-head>div{flex:1;display:grid;gap:2px}
.ws-head b{font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-head .tc{font-size:12.5px;color:var(--muted)}
.ws-group{margin-top:18px}
.ws-group>h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.ws-steps span{font-size:13px;color:var(--muted)}

/* 1.5 timeline */
.tl-top{display:flex;align-items:center;gap:6px;margin-top:12px}
.tl-top .tc{font-size:13px;color:var(--muted);min-width:96px}
.tl-top .icon-btn:disabled,.tl-top .ctl:disabled{opacity:.4}
.tl-redo .ic{transform:scaleX(-1)}
.sp-cv{width:100%;height:280px;display:block;border-radius:10px;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
.sp-nav{display:flex;align-items:center;gap:8px;margin:8px 0}.sp-nav .tc{flex:1;text-align:center}
.tl-meter{width:100%;height:104px;display:block;margin-top:8px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.tl-cv{width:100%;height:142px;display:block;margin-top:10px;touch-action:none;border-radius:12px;background:var(--surface);border:1px solid var(--line);user-select:none;-webkit-user-select:none}
.tl-bar{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tl-bar::-webkit-scrollbar{display:none}
.tl-bar .tool{flex:none}
.tl-bar .tool:disabled{opacity:.45}
.tl-empty{margin:18px 0;text-align:center;color:var(--muted)}
.tl-empty b{display:block;color:var(--ink);font-size:16px}
.tl-empty p{margin:6px 0 0;font-size:14px}
.tl-hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}

.rec-sheet .chip{background:transparent;color:var(--stage-muted);border-color:var(--stage-line)}
.rec-sheet .chip[aria-pressed="true"]{background:var(--stage-ink);color:var(--stage);border-color:var(--stage-ink)}
.rec-sheet .chip:disabled{opacity:.5}
.room{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--stage-muted);text-align:center}
.room .tool{background:transparent;color:var(--stage-ink);border-color:var(--stage-line)}
.room .good{color:var(--stage-mark)}
.room .bad,.rec-warn.bad{color:var(--stage-rec)}
.rec-warn{margin:0;font-size:14px;font-weight:600;color:var(--stage-ink);text-align:center;min-height:1.4em}
/* 1.7 clean */
.cl-list{display:grid;gap:12px;margin-top:14px}
.cl-h{margin:16px 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cl-play{display:flex;align-items:center;gap:10px;margin-top:14px}
.cl-play input{flex:1}
.cl-play .tc{font-size:13px;color:var(--muted);min-width:40px}
.cl-changes{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.cl-changes li{display:grid;gap:2px;font-size:14px}
.cl-changes span{color:var(--muted);font-size:13px}
/* 1.8 trash, settings */
.trash-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.trash-row>div{flex:1;min-width:0;display:grid;gap:2px}
.trash-row b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trash-row span{font-size:12.5px;color:var(--muted)}
#setTplC{margin-top:8px}
.set-sub small.hint{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.about+.about{margin-top:6px;font-family:inherit;font-size:11.5px}
/* 1.9 */
.eq-pre{flex-wrap:wrap;margin-bottom:6px}
.listbar #batchBtn{height:32px;padding:0 11px;font-size:13px;margin-inline-start:auto;margin-inline-end:8px}
/* 2.0 */
.tl-snap{color:var(--muted)}
.tl-snap.on{color:var(--accent);background:var(--accent-soft)}
/* 2.1 */
.cover-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.cover-row img{width:56px;height:56px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
/* 2.2 text editing */
.te-list{display:grid;gap:2px;max-height:52vh;overflow:auto;margin-top:6px}
.te-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.te-row .tc{font-size:12.5px;color:var(--muted);min-width:40px}
.te-row .te-txt{flex:1;font-size:14px;line-height:1.35}
.te-row .icon-btn{width:34px;height:34px}
.te-row input:checked~.te-txt{text-decoration:line-through;opacity:.5}
.te-filler .te-txt{color:var(--mark);font-style:italic}
.te-retake .pill{font-style:normal}
#asrModel{display:grid;gap:8px}
#asrModel .btn{justify-self:start}
/* 2.3 */
.song-more{flex:none;display:grid;place-items:center;width:34px;height:34px;margin:-6px -8px -6px -4px;border-radius:50%;color:var(--muted)}
.song-more:active{background:var(--surface-2)}
.song-more .ic{width:20px;height:20px}
.about-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.priv .mtext{margin:0 0 10px}
.lang-first{position:fixed;inset:0;z-index:999;background:var(--bg);display:grid;place-items:center;padding:24px 16px;overflow:auto}
.lang-card{width:100%;max-width:420px;display:grid;gap:16px;text-align:center}
.lang-card h2{margin:0;font-size:26px}
.lang-card p{margin:0;color:var(--muted)}
.lang-card .langs{justify-content:center}
/* 2.3.2: nothing may be wider than the phone; no rubber-band page */
html{overflow-x:hidden;overscroll-behavior:none}body{overflow-x:clip;max-width:100%}   /* body must not become a scroll box: with overscroll none it swallowed touch scrolling */
.modal-card{overflow-x:hidden;overscroll-behavior:contain}
.set-sub{grid-template-columns:minmax(0,1fr)}
.sel-full,select,input{min-width:0;max-width:100%}
.tl-top{min-width:0}
.tl-top .tc{min-width:0;flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.tl-top .btn.sm{padding:0 12px}
#editTab{min-width:0;max-width:100%}
/* 2.4: what was done to the selected clip */
.tl-fx{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13px}
.tl-fx b{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.tl-fx ol{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.tl-fx li span{font-weight:500}
.tl-fx li small{display:block;color:var(--muted);font-size:12px}
/* 2.5: optional speech-to-text models */
.asr-row{display:grid;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.asr-row:last-of-type{border-bottom:0}
.asr-pick{display:flex;gap:10px;align-items:flex-start}
.asr-pick span{display:grid;gap:2px}
.asr-pick small{color:var(--muted);font-size:12px}
.asr-row .btn{justify-self:start}
/* 3.1: live spectrum + monitoring on the record sheet */
.rec-spec{width:100%;height:46px;display:block;margin-top:6px;opacity:.9}
.rec-mon[aria-pressed="true"]{background:var(--stage-ink);color:var(--stage)}
#recLufs{color:var(--stage-ink)}
/* 3.4: text to speech */
.tts-text{width:100%;box-sizing:border-box;min-height:120px;resize:vertical;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:4px 0 10px}
/* 3.5: menus, selecting several, two-row editor tools */
.rec-more{width:36px;display:grid;place-items:center;color:var(--muted);flex:none}
.rec.picked,.song.picked{background:var(--accent-soft)}
.selecting #mini,.selecting #recBtn{display:none!important}
.chk{display:flex;align-items:center;gap:10px;padding:10px 4px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.chk i{width:10px;height:10px;border-radius:50%;flex:none}
.tl-bar.two{display:grid;grid-auto-flow:column;grid-template-rows:auto auto;justify-content:start}
.rec-open,.song{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
/* 3.6: selection mode (top: count + select all; bottom: labelled actions), rows get a round check */
.seltop[hidden],.selbar[hidden]{display:none!important}
.seltop{position:fixed;top:0;left:0;right:0;z-index:16;display:flex;align-items:center;gap:6px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow);
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px))}
.seltop .sel-n{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel-all{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink);padding:6px 4px 6px 10px;border-radius:999px}
.sel-all i{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;box-sizing:border-box}
.sel-all[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sel-all i .ic{width:14px;height:14px}
.selbar{width:100%;max-width:608px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:5px 4px}
.selbar button{display:grid;justify-items:center;gap:3px;padding:7px 2px 6px;border-radius:12px;font-size:11.5px;font-weight:500;color:var(--ink);min-width:0}
.selbar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbar button:active{background:var(--surface-2)}
.selbar button:disabled{opacity:.4}
.selbar button[data-sb="del"]{color:var(--rec)}
.selecting .rec-open,.selecting .song[data-song]{position:relative;padding-left:50px}
.selecting .rec-open::before,.selecting .song[data-song]::before{content:"";position:absolute;left:15px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;border:2px solid var(--muted);box-sizing:border-box}
.selecting .picked .rec-open::before,.selecting .song.picked::before{background:var(--accent);border-color:var(--accent)}
.selecting .picked .rec-open::after,.selecting .song.picked::after{content:"";position:absolute;left:23px;top:50%;width:5px;height:10px;margin-top:-8px;border:solid var(--accent-ink);border-width:0 2.4px 2.4px 0;transform:rotate(45deg)}
.selecting .fav-btn,.selecting .rec-more,.selecting .song-more{visibility:hidden}
.selecting .wrap{padding-bottom:120px}
.info-dl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:12px 0 4px;font-size:14.5px}
.info-dl dt{color:var(--muted)}
.info-dl dd{margin:0;overflow-wrap:anywhere}
.sort-btn{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;font-weight:500;padding:4px 2px;min-height:32px}
.sort-btn .ic{width:18px;height:18px}
.sort-lab{margin:14px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sort-opts{display:grid;gap:2px}
.sort-opts button,.ex-opt{display:flex;align-items:center;gap:12px;padding:11px 6px;font-size:15.5px;text-align:left;border-radius:10px;width:100%}
.sort-opts button:active{background:var(--surface-2)}
.sort-opts i{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);box-sizing:border-box;flex:none}
.sort-opts [aria-checked="true"] i{border:6px solid var(--accent)}
.ex-chips{display:flex;flex-wrap:wrap;gap:8px}
.ex-more{display:flex;flex-wrap:wrap;gap:8px}
.ex-acts{display:grid!important;grid-template-columns:1fr 1fr;gap:10px}
.ex-acts .btn{width:100%}
/* 3.7: purpose cards on the record screen, live noise/echo switches, recording settings */
.rec-purpose{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 4px 4px;margin:0 -4px;scrollbar-width:none;align-items:stretch}
.rec-purpose::-webkit-scrollbar{display:none}
.pu-card{flex:0 0 72%;max-width:300px;scroll-snap-align:center;text-align:left;display:grid;gap:4px;align-content:start;padding:12px 14px;border-radius:16px;border:1px solid var(--stage-line);background:var(--stage-2);color:var(--stage-muted)}
.pu-card b{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--stage-ink)}
.pu-card b .ic{width:18px;height:18px}
.pu-card span{font-size:13px;line-height:1.35}
.pu-card small{font-family:var(--f-mono);font-size:11px;letter-spacing:.01em;opacity:.9;margin-top:2px}
.pu-card[aria-pressed="true"]{border-color:var(--stage-ink);box-shadow:inset 0 0 0 1px var(--stage-ink)}
.pu-card:disabled{opacity:.55}
.rec-sheet:not([data-state="idle"]) .pu-card:not([aria-pressed="true"]),.rec-sheet:not([data-state="idle"]) .pu-info{display:none}
.rec-sheet:not([data-state="idle"]) .rec-purpose{justify-content:center}
.pu-info{flex:none;align-self:center;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--stage-muted)}
.rec-fx{display:flex;justify-content:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.rec-fx[hidden]{display:none}
.rec-fx .chip .ic{width:16px;height:16px}
.pu-row{display:grid;gap:3px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.pu-row b{display:flex;align-items:center;gap:8px}
.pu-row span{font-size:14px;color:var(--muted)}
.pu-row small{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.rec-qbox{display:grid;gap:14px}
.rec-custom{display:grid;gap:12px;padding:12px;border-radius:12px;background:var(--surface-2)}
/* 3.8: equalizer */
.eq-head{display:flex;align-items:center;gap:12px}
.eq-head h3{margin:0}
.eq-now{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:10px;border-radius:14px;background:var(--surface-2)}
.eq-now .art{width:44px;height:44px;flex:none}
.eq-now div{display:grid;min-width:0}
.eq-now b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq-now span{font-size:12.5px;color:var(--muted)}
.eq-chips{flex-wrap:nowrap;overflow-x:auto;margin:14px -4px 6px;padding:0 4px 2px;scrollbar-width:none}
.eq-chips::-webkit-scrollbar{display:none}
.eq-cv{display:block;width:100%;height:230px;touch-action:none}
.eq-off .eq-cv{opacity:.55}
.eq-knobs{display:flex;justify-content:center;gap:36px;margin-top:10px}
.eq-knob{display:grid;justify-items:center;gap:6px;font-size:13px}
.eq-knob i{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted);
  background:radial-gradient(closest-side,var(--surface) 78%,transparent 80%),conic-gradient(var(--accent) var(--p,0%),var(--surface-2) 0)}
.eq-knob[aria-pressed="true"] i{color:var(--accent);font-weight:600}
/* 3.8: voice change / part mixer */
#vcBody .ex-chips{margin-bottom:4px}
/* 3.9: clip quick bar, record button in the timeline header, countdown */
.tlq #mini,.tlq #recBtn{display:none!important}
.tlq #editTab{padding-bottom:84px}
.tl-recb{color:var(--rec)}
.cd-ov{position:fixed;inset:0;z-index:60;background:rgb(0 0 0 / .62);display:grid;place-content:center;justify-items:center;gap:14px;color:#fff}
.cd-ov b{font-family:var(--f-display);font-size:120px;line-height:1;font-weight:600;animation:cdIn 1s ease-out}
.cd-ov span{font-size:14px;opacity:.8}
@keyframes cdIn{from{transform:scale(1.5);opacity:0}30%{opacity:1}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.cd-ov b{animation:none}}
/* 4.0: intro (dark, story bars, phone frame with a tapping hand; all drawn with CSS) */
.intro{position:fixed;inset:0;z-index:70;background:#0d1412;color:#f3f6f4;display:flex;flex-direction:column;align-items:center;gap:18px;overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 20px calc(env(safe-area-inset-bottom,0px) + 18px);touch-action:pan-y}
.in-top{width:100%;max-width:520px;display:flex;align-items:center;gap:12px}
.in-prog{flex:1;display:flex;gap:5px}
.in-prog i{flex:1;height:3px;border-radius:2px;background:rgb(255 255 255 / .22);overflow:hidden;position:relative}
.in-prog i.done{background:#f3f6f4}
.in-prog i.now::after{content:"";position:absolute;inset:0;background:#f3f6f4;transform-origin:0 50%;animation:inFill 6s linear forwards}
[dir="rtl"] .in-prog i.now::after{transform-origin:100% 50%}
@keyframes inFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.in-skip{color:#f3f6f4;opacity:.8;font-size:14px;font-weight:500;padding:8px 6px}
.in-phone{width:min(56vw,230px);aspect-ratio:9/17;border-radius:34px;border:7px solid #2a3532;background:#16201d;padding:12px;box-shadow:0 20px 60px rgb(0 0 0 / .5);flex:none;margin-top:6px}
.in-screen{position:relative;width:100%;height:100%;border-radius:22px;background:#1d2a26;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:14px}
.in-text{max-width:520px;text-align:center}
.in-text h2{font-family:var(--f-display);font-size:30px;line-height:1.15;margin:4px 0 8px;letter-spacing:-.01em}
.in-text h2 em{font-style:normal;color:#5fd3a6}
.in-text p{margin:0;font-size:15.5px;line-height:1.45;opacity:.78}
.in-nav{width:100%;max-width:520px;display:flex;justify-content:space-between;gap:12px;margin-top:auto}
.in-nav .btn{min-width:120px;background:rgb(255 255 255 / .1);color:#f3f6f4;border-color:transparent}
.in-nav .btn.primary{background:#5fd3a6;color:#0d1412}
.iv-bars{display:flex;align-items:center;gap:3px;height:56px;width:100%;justify-content:center}
.iv-bars i{width:5px;border-radius:3px;background:#5fd3a6;height:calc(14px + 40px * var(--h,.5));animation:ivW 1.1s ease-in-out infinite alternate;animation-delay:calc(var(--i) * -.13s)}
@keyframes ivW{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.iv-bars.noisy i{background:#e2a85c;animation-duration:.35s}
.iv-bars.calm i{animation-duration:1.6s}
.iv-bars.eq{height:90px;gap:6px}.iv-bars.eq i{width:12px;border-radius:4px;background:linear-gradient(#5fd3a6,#3f8fd8);transform-origin:50% 100%;animation-duration:.8s}
.iv-time{font-family:var(--f-mono,monospace);font-size:22px;color:#f3f6f4}
.iv-rec{width:64px;height:64px;border-radius:50%;border:3px solid #f3f6f4;display:grid;place-items:center}
.iv-rec span{width:40px;height:40px;border-radius:50%;background:#e5484d;animation:ivPulse 1.4s ease-in-out infinite}
@keyframes ivPulse{50%{transform:scale(.82)}}
.iv-chip{width:44px;height:44px;border-radius:50%;background:#5fd3a6;color:#0d1412;display:grid;place-items:center}
.iv-chip .ic{width:24px;height:24px}
.iv-tracks{position:relative;width:100%;height:130px}
.iv-tracks b{position:absolute;height:30px;border-radius:8px;background:#3f8fd8}
.iv-tracks b:nth-child(1){top:0;background:#5fd3a6}.iv-tracks b:nth-child(2){top:44px;animation:ivSlide 2.4s ease-in-out infinite alternate}.iv-tracks b:nth-child(3){top:88px;background:#c77dde}
@keyframes ivSlide{to{transform:translateX(-18%)}}
.iv-play{width:56px;height:56px;border-radius:50%;background:#f3f6f4;color:#0d1412;display:grid;place-items:center}
.iv-lock{width:90px;height:90px;border-radius:28px;background:#5fd3a6;color:#0d1412;display:grid;place-items:center}
.iv-lock .ic{width:48px;height:48px}
.iv-off{font-size:13px;opacity:.8;text-align:center}
.iv-hand{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgb(255 255 255 / .85);box-shadow:0 0 0 0 rgb(255 255 255 / .5);animation:ivTap 1.8s ease-out infinite;pointer-events:none}
@keyframes ivTap{0%{transform:translate(26px,30px) scale(1);opacity:0}25%{opacity:1}45%{transform:translate(0,0) scale(1)}55%{transform:scale(.8);box-shadow:0 0 0 0 rgb(255 255 255 / .5)}80%{transform:scale(1);box-shadow:0 0 0 18px rgb(255 255 255 / 0)}100%{opacity:0}}
@media (max-height:640px){.in-phone{width:min(40vw,160px)}.in-text h2{font-size:24px}}
@media (prefers-reduced-motion:reduce){.intro *{animation:none!important}}
/* what's new */
.news{margin:4px 0 8px;padding-inline-start:20px;display:grid;gap:8px;font-size:15px;line-height:1.4}
/* tips over the real screen */
.coach{position:fixed;inset:0;z-index:65}
.co-hole{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgb(0 0 0 / .66);transition:all .25s;pointer-events:none}
.co-tip{position:fixed;left:16px;right:16px;max-width:480px;margin:0 auto;background:var(--surface);color:var(--ink);border-radius:16px;padding:14px 14px 10px;box-shadow:var(--shadow)}
.co-tip::before{content:"";position:absolute;left:calc(var(--ax) - 16px - 9px);width:18px;height:18px;background:var(--surface);transform:rotate(45deg);border-radius:3px}
.co-tip.below::before{top:-7px}.co-tip.above::before{bottom:-7px}

.co-tip p{margin:0 0 10px;font-size:15px;line-height:1.4}
.co-btns{display:flex;align-items:center;gap:8px}
.co-n{font-size:12.5px;color:var(--muted)}
/* home cards */
.qa[hidden]{display:none}
.qa{display:grid;grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:auto auto;gap:10px;margin:4px 0 14px}
.qa button{border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;min-height:84px;color:#fff;text-align:start;min-width:0}
.qa button .ic{width:26px;height:26px}
.qa button b{font-size:14.5px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.qa button small{font-size:12px;opacity:.88;line-height:1.3}
.qa button:active{transform:scale(.97)}
.qa .qa-rec{grid-row:span 2;background:linear-gradient(150deg,#e5484d,#b4233a)}
.qa .qa-rec .ic{width:34px;height:34px}
.qa .qa-rec b{font-size:19px}
.qa .qa-open{background:linear-gradient(150deg,#3f8fd8,#2a64b0)}
.qa .qa-edit{background:linear-gradient(150deg,#1f9b72,#147255)}
.qa .qa-video{background:linear-gradient(150deg,#9b5de5,#6c3bb8)}
.qa .qa-music{background:linear-gradient(150deg,#f0a43a,#d0731c)}
.selecting .qa{display:none}
/* 4.0.1: the export sheet fits small screens and big fonts: tighter, and its two main buttons always stay in sight */
.ex-sheet .modal-body{gap:12px}
.ex-sheet .sort-lab{margin:0 0 6px}
.ex-sheet .chip{min-height:36px;padding:0 14px}
.ex-sheet .ex-more .btn{flex:1 1 auto}

@media (max-width:440px){.tl-top{gap:2px}.tl-top .icon-btn{width:36px;height:36px}.tl-top #tlPlay{width:44px!important;height:44px!important}.tl-top .btn.sm{padding:0 10px;white-space:nowrap;flex:none}}
/* 4.3: edit screen — fixed top row, tracks scroll inside, one card below */

body.ed #editTab>*{flex:none}

.tl-scroll{flex:1 1 auto!important;min-height:120px;overflow-y:auto;overscroll-behavior:contain;margin-top:8px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}

.tc-badge,.tc-ab{flex:none;height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.tc-badge{color:var(--kc,var(--accent));background:var(--ks,var(--accent-soft));border-color:transparent}
.tc-ab .ic{width:15px;height:15px}
.tc-sug{display:flex;align-items:center;gap:9px;padding:7px 7px 7px 10px;border-radius:12px;background:var(--surface-2);min-width:0}

.tc-sug-t{flex:1;min-width:0;font-size:13px;line-height:1.3;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tc-sug.ok .tc-sug-t{color:var(--muted)}
.tc-score{--h:calc(var(--s) * 1.2);flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 12.5px var(--f-mono);color:hsl(var(--h) 60% 38%);background:hsl(var(--h) 70% 50% / .16)}
.tc-go{flex:none;height:32px;padding:0 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px}
.tc-go:disabled{opacity:.45}
.tc-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.tc-grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tc-tile{display:grid;justify-items:center;align-content:center;gap:3px;min-height:54px;padding:5px 1px;border-radius:11px;background:var(--surface-2);font-size:10.5px;line-height:1.15;text-align:center;color:var(--ink)}
.tc-tile .ic{width:20px;height:20px}
.tc-tile span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.tc-tile:active{transform:scale(.96)}
.tc-tile:disabled{opacity:.45}
.tc-tile.k{background:var(--ks,var(--accent-soft))}
.tc-tile.k .ic{color:var(--kc,var(--accent))}
.tc-tile.del .ic{color:var(--rec)}
.tc-tile.rec{background:var(--rec-soft)}
.tc-tile.rec .ic{color:var(--rec)}
.tc-rec{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tc-rec .hint{border:0;padding:0;background:none;font-size:12.5px;flex:1;min-width:140px}
.dr-card{max-height:88%}
.dr-head{position:sticky;top:-22px;z-index:2;background:var(--surface);margin:-22px -18px 0;padding:22px 18px 10px}
.dr-search{display:flex;align-items:center;gap:8px;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--muted);margin-top:6px}
.dr-search input{flex:1;min-width:0;border:0;background:none;font-size:15px;color:var(--ink);outline:none}
.drawer{display:grid;gap:14px}

.dr-g h4::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--kc)}
.dr-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dr-t{display:grid;justify-items:center;align-content:start;gap:5px;padding:8px 2px;border-radius:12px;background:var(--surface-2);font-size:11.5px;line-height:1.15;text-align:center;color:var(--ink);min-height:70px}
.dr-t[hidden],.dr-g[hidden]{display:none}
.dr-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--ks);color:var(--kc)}
.dr-ic .ic{width:18px;height:18px}
.dr-t:disabled{opacity:.45}
.hist{margin:10px 0 0;padding:0 0 0 22px;display:grid;gap:8px}
.hist li b{display:block;font-size:14px}
.hist li small{color:var(--muted);font-size:12.5px}
@media (max-width:330px){.tc-tile{font-size:9.5px}.dr-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* 4.4: card groups */
.tc-tile.cat{background:var(--ks);color:var(--ink)}
.tc-tile.cat .ic{color:var(--kc)}
.tc-tile.cat.hl{box-shadow:inset 0 0 0 2px var(--kc)}

.tc-cat .icon-btn{width:36px;height:36px}
/* 4.4: one thin bar on top: logo, tabs (only the open one named), settings */
.top{padding-block:10px 2px;gap:8px}
.top .brand{flex:none;gap:0}
.top .brand>div:not(.logo){display:none}
#count{display:none}
.top .logo{width:32px;height:32px;border-radius:9px}

.top .tabs{margin:0;flex:0 1 auto;min-width:0;border-radius:999px;padding:3px;gap:2px}
.top .tabs button{flex:none;height:34px;border-radius:999px;padding:0 11px;font-size:13.5px;gap:6px}
.top .tabs button:not([aria-selected="true"]) [data-t]{display:none}
.top .tabs .ic{width:17px;height:17px}
.top #setBtn{margin-inline-start:auto}
.pghead{display:flex;align-items:flex-end;gap:8px;margin-top:12px;min-width:0}
.pghead[hidden]{display:none}
.pghead h2{font-family:var(--f-display);font-size:27px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1}
.pgsum{color:var(--muted);font-size:12.5px;padding-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pghead #importBtn{min-height:38px;width:38px;padding:0;border-radius:50%;flex:none}
.pghead #importBtn [data-t]{display:none}
.toolbar{padding-block:10px 6px;gap:8px}
/* 4.4: plain numbers (no typewriter font), except the big recording clock */
:root{--f-mono:var(--f-body)}
.timecode{font-family:"IBM Plex Mono",ui-monospace,monospace}
/* 4.4: tighter record rows: coloured round icon, title, one info line, small wave on the right */
.rec-open{padding:9px 0 9px 12px;grid-template-columns:34px minmax(0,1fr) 58px;column-gap:10px;row-gap:1px;align-items:center}
.rec-ic{grid-row:1/span 2;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.rec-ic .ic{width:14px;height:14px}
.rec-top,.rec-sub{grid-column:2}
.rec-title{font-size:14.5px}
.rec-sub{flex-wrap:nowrap;overflow:hidden;white-space:nowrap;gap:2px 8px;font-size:12px}
.rec-open .mini-wave{grid-column:3;grid-row:1/span 2;width:58px;height:20px;margin:0}
.rec-open .hit{grid-column:2/4}
.rec .fav-btn{width:38px}
.rec .fav-btn:not(.on){opacity:.45}
.rec .rec-more{width:32px}
.day{margin-top:10px}
.day h3{margin-bottom:6px}
/* 4.4: music rows */
.song{padding:7px 10px 7px 8px;gap:11px}
.song .art{width:44px;height:44px}
.song-txt b{font-size:14.5px}
.song-txt span{font-size:12.5px}
.dup{font-style:normal;font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 5px;margin-inline-start:6px;vertical-align:1px}
.album .art .ic{width:40px;height:40px}
/* 4.4: the record button says "Record" and sits bottom-right */
.dock .fab{justify-self:end;margin-inline-end:16px;width:auto;height:54px;border-radius:999px;background:var(--rec);border-color:transparent;color:#fff;display:flex;align-items:center;gap:9px;padding:0 20px 0 16px;box-shadow:0 8px 20px rgb(207 42 57 / .35)}
.dock .fab span{width:18px;height:18px;background:#fff}
.dock .fab b{font-size:15px;font-weight:700}
/* 4.4: recorder: level word + bar, purpose cards fold into one line while recording */
.lvl{display:inline-block;width:120px;height:6px;border-radius:3px;background:var(--stage-line);overflow:hidden;vertical-align:middle}
.lvl i{display:block;height:100%;border-radius:3px;background:var(--stage-muted);transition:width .12s}
.lvl.lvGood i{background:#3fbf7a}.lvl.lvQuiet i{background:#8e96a1}.lvl.lvLoud i{background:#e8b13f}.lvl.lvClip i{background:var(--stage-rec)}
.lvt{font-family:var(--f-body);font-size:12.5px}
.lvt.lvGood{color:#3fbf7a}.lvt.lvLoud{color:#e8b13f}.lvt.lvClip{color:var(--stage-rec)}
html:not(.tech) #recLufs{display:none!important}
html:not(.tech) .pu-card small{display:none}
.rec-sum{display:none;text-align:center;color:var(--stage-muted);font-size:13px;margin:6px 0 0}

.rec-sheet:not([data-state="idle"]) #purposeRow,.rec-sheet:not([data-state="idle"]) #recFx,.rec-sheet:not([data-state="idle"]) #roomBox,.rec-sheet:not([data-state="idle"]) #modeHint{display:none!important}
/* 4.4.1: level bar with its word underneath, centred */
#recPeak{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
/* 4.6: key and tempo result */
.key-res{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.key-res>div{background:var(--surface-2);border-radius:14px;padding:14px;display:grid;gap:4px}

.key-res b{font-size:22px;font-family:var(--f-display)}
.key-res span{color:var(--muted);font-size:13px}
/* 4.11.2: experimental badge, history with listen / go back */
.beta{position:relative}
.beta::after{content:attr(data-beta);position:absolute;top:3px;right:3px;font-size:8.5px;font-weight:700;letter-spacing:.02em;padding:1px 4px;border-radius:5px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.hist.h2{list-style:none;padding:0;counter-reset:h}
.hist.h2 li,.hist li:has(div){display:flex;align-items:center;gap:8px;justify-content:space-between}
.hist.h2 li{padding:8px 0;border-bottom:1px solid var(--line)}
.hist.h2 li>div{min-width:0}
.hist.h2 li.now b{color:var(--accent)}
.h-acts{display:flex;align-items:center;gap:4px;flex:none}

.rk{border:1px solid var(--line);border-radius:12px;padding:6px 10px 2px;margin-bottom:8px}

.rk-sec{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:6px 2px 4px}

/* 5.3 practice + tuner */
.pr-ab,.pr-info{display:flex;align-items:center;gap:8px;margin:4px 0 8px}
.pr-ab .tc{margin-left:auto;font-size:12.5px;color:var(--muted)}

.pr-go{display:grid;gap:8px;margin-top:10px}

.tun b{font-size:56px;line-height:1;font-weight:700}
.tun-bar{position:relative;width:100%;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--surface-2),var(--line) 50%,var(--surface-2))}
.tun-bar i{position:absolute;top:-5px;left:50%;width:4px;height:20px;margin-left:-2px;border-radius:2px;background:var(--danger,#d33);transition:left .12s}

.lyr{text-align:center;margin:8px 4px;display:grid;gap:3px}

function scheduleBackground(delay) {
  if (!NATIVE || !(S.precompute || S.autoText)) return;
  clearTimeout(bgTimer);
  bgTimer = setTimeout(runBackground, delay == null ? 2500 : delay);
}
async function runBackground() {
  if (bgBusy || !(S.precompute || S.autoText) || document.hidden) { if (!bgBusy) scheduleBackground(5000); return; }
  const next = !S.precompute ? null : recItems().filter(r => r.src && r.duration > 0 && r.duration < 4 * 3600 && !storedPeakIds.has(r.id) && !peakJobs.has(r.id) && !isComplete(S.peaks.get(r.id)))
    .sort((a, b) => b.created - a.created)[0];
  if (!next) {
    // speech-to-text in the background, newest first, so every recording becomes searchable by its words
    const tn = S.autoText && CAPS.asr && hasAsr() ? recItems().filter(r => r.src && !r.ttext && !textTried.has(r.id) && !BUSY.has(r.id) && r.duration > 2 && r.duration < 3600)
      .sort((a, b) => b.created - a.created)[0] : null;
    if (!tn) return;
    textTried.add(tn.id); bgBusy = true;
    try { await transcribeItem(tn, true); } catch (e) {}
    bgBusy = false;
    scheduleBackground(2000);
    return;
  }
  bgBusy = true;
  try { await ensurePeaks(next, { bg: true }); } catch (e) {}
  bgBusy = false;
  if (S.tab !== 'music' && !plOpen()) renderList();
  scheduleBackground(600);
}

/* ---------- toast ---------- */
let toastT = 0;
function toast(msg, ms) {
  const el = $('#toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toastT); if (ms !== 0) toastT = setTimeout(() => { el.hidden = true; }, ms || 2600);
}
const hideToast = () => { $('#toast').hidden = true; };

/* ---------- overlays + back button ---------- */
const stack = [];
let SEL = null;
let armed = false, pendingBack = false;
function arm() { if (IN_FRAME || armed || pendingBack) return; try { history.pushState({ sd: 1 }, ''); armed = true; } catch (e) {} }
function disarm() { if (IN_FRAME || !armed) return; armed = false; pendingBack = true; try { history.back(); } catch (e) { pendingBack = false; } }
addEventListener('popstate', () => {
  if (pendingBack) { pendingBack = false; if (stack.length || SEL) arm(); return; }
  if (!armed) return;
  armed = false;
  const top = stack[stack.length - 1];
  if (top) closeOverlay(top, true); else if (SEL) selEnd(true);
  if (stack.length || SEL) arm();
});
const elOf = n => ({ rec: $('#recSheet'), player: $('#player'), modal: $('#modal'), coll: $('#coll') })[n];
function openOverlay(n) {
  const el = elOf(n);
  if (!stack.includes(n)) stack.push(n);
  el.hidden = false; void el.offsetWidth; el.classList.add('open');
  if (n === 'rec') bars('stage');
  document.body.classList.add('locked');
  arm();
}
function hideEl(el) {
  el.classList.remove('open');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(() => { if (!el.classList.contains('open')) el.hidden = true; }, reduce ? 0 : 260);
}
let modalOnClose = null;
function closeOverlay(n, fromPop) {
  if (n === 'rec' && R.state !== 'idle') { if (fromPop) askCancelRec(); return false; }
  if (n === 'modal' && S.modalLocked) return false;
  const i = stack.indexOf(n); if (i < 0) return false;
  stack.splice(i, 1);
  hideEl(elOf(n));
  if (n === 'rec') bars('page');
  if (n === 'modal') { const f = modalOnClose; modalOnClose = null; if (f) f(); }
  if (n === 'player') onPlayerClosed();
  if (!stack.length) document.body.classList.remove('locked');
  if (!fromPop && !stack.length && !SEL) disarm();
  updateMini();
  return true;
}
function swapOverlay(from, to) {
  const i = stack.indexOf(from);
  if (i >= 0) stack.splice(i, 1);
  hideEl(elOf(from));
  if (from === 'rec') bars('page');
  openOverlay(to);
}

/* ---------- modal helpers ---------- */
function openModal(html, onClose) {
  const card = $('#modalCard');
  card.innerHTML = html;
  modalOnClose = onClose || null;
  openOverlay('modal');
  return card;
}
const closeModal = () => closeOverlay('modal');
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function confirmBox({ title, text, ok, cancel, danger = false }) {
  return new Promise(res => {
    let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    const card = openModal(`<h3>${esc(title)}</h3><p class="mtext">${esc(text)}</p>
      <div class="modal-actions"><span class="spacer"></span><button class="btn" type="button" data-x>${esc(cancel || t('cancel'))}</button>
      <button class="btn ${danger ? 'danger-fill' : 'primary'}" type="button" data-ok>${esc(ok || t('ok'))}</button></div>`, () => fin(false));
    card.querySelector('[data-ok]').onclick = () => { fin(true); closeModal(); };
    card.querySelector('[data-x]').onclick = () => closeModal();
    setTimeout(() => card.querySelector('[data-ok]').focus(), 50);
  });
}
function chooseBox(title, text, options) {
  return new Promise(res => {
    let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    const card = openModal(`<h3>${esc(title)}</h3>${text ? `<p class="mtext">${esc(text)}</p>` : ''}
      <div class="choice">${options.map(o => `<button type="button" data-v="${o.value}"><b>${esc(o.label)}</b><span>${esc(o.desc)}</span></button>`).join('')}</div>
      <div class="modal-actions"><span class="spacer"></span><button class="btn" type="button" data-x>${esc(t('cancel'))}</button></div>`, () => fin(null));
    card.querySelectorAll('[data-v]').forEach(b => { b.onclick = () => { fin(b.dataset.v); closeModal(); }; });
    card.querySelector('[data-x]').onclick = () => closeModal();
  });
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && stack.length) { const top = stack[stack.length - 1]; if (top === 'rec' && R.state !== 'idle') askCancelRec(); else closeOverlay(top); }
});

function matchRec(r, q) {
  if (norm(r.title).includes(q)) return { kind: 'title' };
  for (const b of r.bookmarks || []) if (norm(b.label).includes(q) || norm(b.note).includes(q)) return { kind: 'bm', b };
  if (norm(r.notes).includes(q)) return { kind: 'note' };
  if ((r.tags || []).some(x => norm(x).includes(q))) return { kind: 'tag' };
  if (norm(r.ttext).includes(q)) return { kind: 'text' };
  const c = catById(r.categoryId); if (c && norm(c.name).includes(q)) return { kind: 'cat' };
  if (norm(r.folder).includes(q)) return { kind: 'folder' };
  return null;
}
function visibleRecs() {
  let r = recItems();
  if (S.filter === 'fav') r = r.filter(x => x.fav);
  else if (S.filter === 'none') r = r.filter(x => !catsOf(x).length);
  else if (S.filter !== 'all') r = r.filter(x => inCat(x, S.filter));
  const q = norm(S.q.trim());
  r.forEach(x => { x._hit = null; });
  if (q) r = r.filter(x => (x._hit = matchRec(x, q)));
  return r.sort(sortCmp('rec'));
}

function sortGet(m) {
  const v = ls.get(m === 'music' ? 'msort2' : 'sort2', null);
  if (v && SORTF[m].includes(v[0])) return v;
  if (m === 'music') return ['name', 'a'];
  return { old: ['date', 'a'], long: ['dur', 'd'], name: ['name', 'a'] }[S.sort] || ['date', 'd'];
}
function sortCmp(m) {

function extFor(r) {
  const m = (r.mime || '').toLowerCase(), f = r.fileName || r.name || '';

  if (fe) return fe.toLowerCase();
  if (m.includes('webm')) return 'webm';
  if (m.includes('mp4') || m.includes('m4a') || m.includes('aac')) return 'm4a';
  if (m.includes('ogg') || m.includes('opus')) return 'ogg';

const STOP = new Set(('ve veya ile ama fakat ancak çünkü ki de da mi mı mu mü bir bu şu o ben sen biz siz onlar bunu şunu onu bunun onun için gibi kadar daha çok en her hiç hem ya ne nasıl neden niye niçin şey şeyi şimdi sonra önce yani işte evet hayır var yok olan olarak oldu olur olsun değil diye ise artık bile sadece aslında belki tabii böyle şöyle öyle burada orada zaman bazı tüm bütün kendi diğer başka the and for that this with are was you have not but they his her from what all were when your can there their will would about which them then than into just like more some also very had has its our out who how why where').split(' '));

/** earlier attempts of a sentence that is said again within 45 s: their indexes */
function findRetakes(segs) {
  const out = new Set();
  const sim = (a, b) => {
    if (!a.length || !b.length) return 0;
    const n = a.length, m = b.length, d = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) d[i][j] = a[i - 1] === b[j - 1] ? d[i - 1][j - 1] + 1 : Math.max(d[i - 1][j], d[i][j - 1]);
    return 2 * d[n][m] / (n + m);
  };
  const W = segs.map(s => words(s[2]));
  for (let i = 0; i < segs.length; i++) {
    if (W[i].length < 2) continue;
    for (let j = i + 1; j < segs.length && segs[j][0] - segs[i][1] < 45; j++) {
      if (W[j].length < 2) continue;
      const head = W[i].slice(0, 3).join(' ') === W[j].slice(0, 3).join(' ') && W[i].length >= 3;
      if (head || sim(W[i], W[j]) >= 0.6) { out.add(i); break; }
    }
  }
  return out;
}

/** TextTiling: a new topic starts where the words before and after a sentence boundary have least in common */
function topicChapters(segs, dur) {

  const bag = (from, to) => { const m = new Map(); for (let i = 0; i < segs.length; i++) if (segs[i][0] >= from && segs[i][0] < to) for (const w of W[i]) m.set(w, (m.get(w) || 0) + 1); return m; };

  for (let k = 0; k < starts.length; k++) {

    .concat([2, 3, 4].filter(k => k <= Math.max(2, free)).map(k => ({ value: String(k), label: t('spkN', { n: k }), desc: t('spkND') }))));
  if (!n) return;
  tlStop();
  if (!CAPS.spk) {
    if (!(await confirmBox({ title: t('spkGetQ'), text: t('spkGetD'), ok: t('spkGetOk') }))) return;
    toast(t('bgNote'), 3500);
    try { await bgStart('spkGet', 'dl:spk', t('spkGetting'), {}); CAPS.spk = true; } catch (e) { if (!String(e.message).includes('pause')) toast(errText(e), 5000); return; }
  }
  let res;
  try { res = await tlRunJob(t('spkBusy'), 'tlSpk', { path: c.path, in: c.in, out: c.out, n: +n }); } catch (e) { toast(errText(e), 5000); return; }
  if (!res.n || !res.segs.length) { toast(t('spkNone'), 4000); return; }
  if (res.n < 2) { toast(t('spkOne'), 4000); return; }
  // join pieces of one speaker that are close together, a little air around each piece
  const PAD = 0.06, GAP = 0.35, per = Array.from({ length: res.n }, () => []);
  for (const [a, b, k] of res.segs) { const L = per[k], l = L[L.length - 1]; if (l && a - l[1] < GAP) l[1] = Math.max(l[1], b); else L.push([a, b]); }
  const before = tlSnap(), base = c.name || '', span = [c.at, c.at + tlLen(c)];
  const loud = res.db.filter(d => d > -80), ref = loud.length ? loud.reduce((x, y) => x + y, 0) / loud.length : 0;
  TL.p.clips = TL.p.clips.filter(x => x.id !== c.id);
  let used = 0;
  per.forEach((L, k) => {
    if (!L.length) return;
    const tr = k === 0 ? c.tr : tlFreeTrack(span[0], span[1], null, c.tr + k);
    tlEnsureTrack(tr);
    const gain = res.db[k] > -80 ? clamp(Math.round((ref - res.db[k]) * 2) / 2, -10, 10) : 0;
    for (const [a, b] of L) {
      const i = Math.max(c.in, a - PAD), o = Math.min(c.out, b + PAD);
      if (o - i < 0.05) continue;
      TL.p.clips.push(Object.assign({}, c, { id: uid(), tr, in: i, out: o, at: c.at + i - c.in, fi: 0.03, fo: 0.03, gain: (c.gain || 0) + gain, name: t('spkName', { n: k + 1 }) + (base ? ' · ' + base : ''), beats: null }));

}

/** re-record from the playhead on the selected clip: up to 2 s before it play as a cue, the new take replaces the old part */
async function tlPunch() {
  const c = tlSel(); if (!c || TL.busy || TL.rec) return;
  const T = TL.pos;
  if (T < c.at + 0.05 || T > c.at + tlLen(c) - 0.05) { toast(t('punchWhere'), 3500); return; }
  tlStop();
  const pre = Math.min(2, T);
  const name = t('fileVoice', { d: stamp(Date.now()) }) + '.m4a';
  let res = {};
  try { res = JSON.parse(AND.recStart('voice', name, recOpts())); } catch (e) { res = {}; }
  if (!res.ok && res.error === 'perm') {
    if (!(await askPerm('mic'))) { toast(t('micPerm'), 4500); return; }
    try { res = JSON.parse(AND.recStart('voice', name, recOpts())); } catch (e) { res = {}; }
  }
  if (!res.ok) { toast(t('recFail'), 4200); return; }
  TL.rec = { at: T - pre, t0: performance.now(), started: Date.now(), punch: { id: c.id, t: T, pre } };
  // the cue: everything as it is, except the selected clip stops where the new take starts
  const tr = TL.p.tracks, mix = [];
  for (const x of TL.p.clips) {
    if (!tr[x.tr] || tr[x.tr].mute) continue;
    const len = x === c ? T - x.at : tlLen(x);
    mix.push({ path: x.path, at: x.at, in: x.in, len, g: Math.pow(10, ((x.gain || 0) + (tr[x.tr].vol || 0)) / 20), fi: x.fi || 0, fo: x === c ? 0 : x.fo || 0, duck: tr[x.tr].duck ? (tr[x.tr].duckDb || -12) : 0 });
  }
  TL.pos = T - pre;
  tlPlay(mix);
  renderTlBar();
  const loop = () => {
    const r = TL.rec; if (!r) return;
    const el = $('#tlRecT'); if (el) el.textContent = fmt(Math.max(0, (performance.now() - r.t0) / 1000 - pre));
    if (!TL.play) TL.pos = r.at + (performance.now() - r.t0) / 1000;
    drawTl(); requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
async function tlPunchFinish(it, p) {
  let res;
