  const c = TL.p.clips.find(x => x.id === p.id); if (!c) return;

  const inn = Math.min(dur - 0.1, Math.max(0, p.pre + (+ls.get('recLat', 0) || 0) / 1000));

async function makeSample() {
  if (!OAC) return null;
  const sr = 22050, len = 22;
  const oc = new OAC(1, sr * len, sr);
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const tone = (m, t0, dur, gain, type) => {
    const o = oc.createOscillator(), g = oc.createGain();
    o.type = type || 'triangle'; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(gain, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    o.connect(g); g.connect(oc.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  };
  const chords = [[57, 60, 64], [53, 57, 60], [48, 55, 64], [55, 59, 62]];
  const bar = 2.4;
  for (let b = 0; b < 8; b++) {
    const ch = chords[b % 4], t0 = b * bar, loud = b >= 4 ? 0.2 : 0.12;
    tone(ch[0] - 12, t0, bar * 0.95, loud * 1.1, 'sine');
    const arp = [0, 1, 2, 1, 2, 1, 0, 1];
    arp.forEach((k, i) => tone(ch[k] + (i === 4 ? 12 : 0), t0 + i * bar / 8, 0.55, loud * 0.8));
  }
  const beat = bar / 4;
  const mel = [[0, 76, 1], [1, 74, .5], [1.5, 72, 1.5], [3, 72, 1], [4, 71, .5], [4.5, 74, 1.5], [6, 72, .75], [6.75, 71, .5], [7.25, 69, .75]];
  for (const [start, gain] of [[2 * bar, 0.18], [6 * bar, 0.26]]) for (const [b, m, d] of mel) tone(m, start + b * beat, d * beat * 1.6, gain, 'sine');
  tone(57, 8 * bar, 2.6, 0.24, 'sine'); tone(64, 8 * bar, 2.6, 0.14, 'triangle'); tone(69, 8 * bar, 2.6, 0.12, 'sine');
  const ab = await new Promise((res, rej) => {
    oc.oncomplete = e => res(e.renderedBuffer);
    const p = oc.startRendering(); if (p && p.then) p.then(res, rej);
  });

}

function blobToB64(b) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = () => rej(fr.error); fr.readAsDataURL(b); });
}
async function migrateLegacy() {
  if (!NATIVE) return;
  const legacy = [...S.items.values()].filter(it => !it.src);
  if (!legacy.length) return;
  let moved = 0, i = 0;
  for (const old of legacy) {
    i++;
    const b = await db.get('blobs', old.id).catch(() => null);
    if (old.sample || !b || !b.blob) { await forgetItem(old.id); continue; }
    toast(t('migrate', { i, n: legacy.length }), 0);
    try {
      const ext = extFor(old) === 'audio' ? 'webm' : extFor(old);
      const tok = AND.beginFile(safeName(old.title) + '.' + ext, (b.blob.type || old.mime || '').split(';')[0]);
      if (!tok) throw new Error('open');
      const CH = 768 * 1024;
      for (let o = 0; o < b.blob.size; o += CH) { if (!AND.appendFile(tok, await blobToB64(b.blob.slice(o, o + CH)))) throw new Error('write'); }
      const res = await runJob('commit', { token: tok, name: safeName(old.title), ext, mime: (b.blob.type || '').split(';')[0] });
      const it = fromNative(res, null);
      Object.assign(it, { title: old.title, userTitle: true, created: old.created, notes: old.notes || '', bookmarks: old.bookmarks || [],
        categoryId: old.categoryId || null, fav: !!old.fav, peaks: old.peaks, source: old.source, mode: old.mode, kind: 'rec' });
      if (!it.duration) it.duration = old.duration;
      S.items.set(it.id, it); await saveRec(it);
      const pk = await db.get('peaks', old.id).catch(() => null);
      if (pk) { await storePeaks(it.id, pk.data, pk.rate); storedPeakIds.add(it.id); }
      await forgetItem(old.id);
      moved++;
    } catch (e) { /* keep the old copy; try again on the next start */ }
  }
  hideToast();
  if (moved) toast(t('migrated', { n: moved }), 3500);
}

function tlPaste() {

  const before = tlSnap(), at = cb.at != null ? cb.at : TL.pos, len = cb.out - cb.in;

/** opens a gap at the playhead: clips crossing it are split, everything later moves right */
async function tlInsertSilence() {
  if (TL.busy) return;
  const v = await askParams(t('tlInsSil'), t('tlInsSilD'), [['silLen', 0.5, 30, 0.5, ls.get('silLen', 2), secs]]);
  if (!v) return;
  ls.set('silLen', v.silLen);
  tlStop();
  const before = tlSnap(), at = TL.pos, d = v.silLen, add = [];
  for (const c of TL.p.clips) {
    const k = at - c.at;
    if (k > 0.01 && k < tlLen(c) - 0.01) {
      const n = Object.assign({}, c, { id: uid(), in: c.in + k, at: at + d, fi: 0 });
      c.out = c.in + k; c.fo = 0; add.push(n);
    } else if (c.at >= at - 0.001) c.at += d;
  }
  TL.p.clips.push(...add);
  for (const m of TL.p.markers || []) if (m.t >= at) m.t += d;
  tlCommit(before);

}

/* after a recording: long silences (over 2 s) shrink, the original is replaced */
async function silenceCut(it) {
  if (!NATIVE || !it.src) return it;
  toast(t('silCutRun'), 2500);
  try {
    const d = await runJob('diagnose', { src: it.src, pmax: 2, pkeep: 0.6 });
    if (!d.pauses) return it;
    const res = await runJob('wsOp', { path: d.path, op: 'pauses', max: 2, keep: 0.6 });
    if (res.same) return it;
    const sv = await runJob('wsSave', { path: res.path, name: (it.name || it.title).replace(/\.[^.]+$/, ''), format: 'm4a', replace: it.src });
    const cuts = (res.report && res.report.cuts) || [];
    const shift = tm => { let s = 0; for (const [o, l] of cuts) { if (o + s < tm) s += Math.min(l, tm - o - s); } return Math.max(0, tm - s); };
    const meta = Object.assign({}, it); delete meta.peaks; delete meta.size;
    const nit = fromNative(sv.item, meta);
    nit.bookmarks = (it.bookmarks || []).map(b => Object.assign({}, b, { t: shift(b.t) }));
    await forgetItem(it.id);
    S.items.set(nit.id, nit); await saveRec(nit);
    render();
    toast(t('silCutDone', { s: nf1.format((res.report && res.report.saved) || 0) }), 3500);
    return nit;
  } catch (e) { toast(errText(e), 4000); return it; }
  finally { try { runJob('wsClean', { keep: [] }).catch(() => {}); } catch (e) {} }
}

/* ----- smart check: the clean-up analysis on one clip, a 0–100 score, one tap to fix what it found ----- */
function tlScore(d, music) {
  let s = 100;
  if (!music && d.snr < 35) s -= Math.min(30, (35 - d.snr) * 1.2);
  if (d.clipped > 50) s -= 10;
  if (d.hum > 6) s -= 8;
  if (d.clicks >= 3) s -= 5;
  if (!music && d.plosive >= 0.2) s -= 5;
  if (!music && d.sib >= 1) s -= 4;
  if (!music && d.eq >= 2) s -= 6;
  if (!music && d.speech && d.lra > 8) s -= 5;
  return Math.round(clamp(s, 15, 100));
}
async function tlSmart() {

  const issues = clIssues(d, purpose).filter(([k, , on]) => k !== 'loud' && k !== 'trim' && k !== 'pauses' && on !== false);
  TL.dg = { id: c.id, path: c.path, d, purpose, issues, fixes: issues.map(x => x[0]), score: tlScore(d, music) };

}
async function tlSmartFix() {
  const c = tlSel(), dg = TL.dg; if (!c || !dg || dg.id !== c.id || TL.busy) return;
  tlStop();
  let res, add;
  try {
    res = await tlRunJob(t('smFixing'), 'clean', Object.assign(pauseArgs(), { path: dg.d.path, fixes: dg.fixes, strength: 1, target: purposeTarget(dg.purpose), ai: !!CAPS.sep && dg.purpose !== 'music' }, roomArgs(dg.d)));
    add = await tlRunJob(t('smFixing'), 'tlAdd', { src: { path: res.path } });   // the result lives in the clean-up cache: copy it into the project
  } catch (e) { toast(errText(e), 5000); return; }
  const before = tlSnap(), nd = add.dur / 1000, old = c.path, b4 = tlState(c);
  if (Math.abs(nd - c.dur) > 0.01) { c.in = 0; c.out = nd; delete c.env; }
  Object.assign(c, { path: add.path, dur: nd, ch: add.ch, prev: old });
  delete c.chg;
  c.out = Math.min(c.out, nd); c.in = Math.min(c.in, c.out - 0.05);
  tlStep(c, { op: 'smart', r: dg.fixes.map(k => t('op_' + k)).join(', ') }, b4);
  TL.dg = null;
  tlCommit(before);
  tlDiff(c.id, old, add.path);
  toast(t('smDone', { n: dg.fixes.length }), 3500);
}
