<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><g fill="currentColor"><rect x="3.5" y="10" width="2" height="4" rx="1"/><rect x="7" y="7" width="2" height="10" rx="1"/><rect x="10.5" y="4" width="2" height="16" rx="1"/><rect x="14" y="8.5" width="2" height="7" rx="1"/><rect x="17.5" y="10.5" width="2" height="3" rx="1"/></g><path d="M12.5 4.2l5.2 1.9-5.2 1.9z" fill="#F2B83D"/></svg>
      </div>
      <div style="min-width:0">
        <h1>Ses Defteri</h1>
        <p class="sum" id="summary">&nbsp;</p>
      </div>
    </div>
    <button class="btn" id="importBtn" type="button" data-ta="import"><span id="importIc"></span><span data-t="import"></span></button>
    <button class="icon-btn" id="setBtn" type="button" data-ta="settings"></button>
  </header>

  <div class="tabs" id="tabs" role="tablist" hidden>
    <button type="button" role="tab" data-tab="rec" aria-selected="true"><span id="tabRecIc"></span><span data-t="tabRec"></span></button>
    <button type="button" role="tab" data-tab="music" aria-selected="false"><span id="tabMusicIc"></span><span data-t="tabMusic"></span></button>
    <button type="button" role="tab" data-tab="edit" aria-selected="false"><span id="tabEditIc"></span><span data-t="tabEdit"></span></button>
  </div>

  <div class="notice" id="micNote" hidden>
    <p><b data-t="micNoteB"></b> <span data-t="micNoteP"></span></p>
    <button class="icon-btn" id="micNoteX" type="button" data-ta="close"></button>
  </div>
  <div class="notice" id="storeNote" hidden>
    <p><b data-t="storeNoteB"></b> <span data-t="storeNoteP"></span></p>
  </div>
  <div class="notice" id="libNote" hidden>
    <div style="flex:1;min-width:0"><p><b data-t="libNoteB"></b> <span data-t="libNoteP"></span></p>
    <div class="row"><button class="btn sm primary" type="button" data-perm data-t="allow"></button></div></div>
    <button class="icon-btn" id="libNoteX" type="button" data-ta="close"></button>
  </div>

  <div class="toolbar">
    <label class="search"><span id="searchIc"></span><input id="q" type="search" data-tp="searchRec" autocomplete="off" enterkeyhint="search"><button class="icon-btn" id="qClear" type="button" data-ta="clearSearch" hidden></button></label>
    <div class="chips" id="chips" role="toolbar" data-ta="categories"></div>
    <div class="listbar" id="listbar"><span id="count"></span>
      <select class="sort" id="sort" data-ta="sort">
        <option value="new" data-t="sortNew"></option>
        <option value="old" data-t="sortOld"></option>
        <option value="long" data-t="sortLong"></option>
        <option value="name" data-t="sortName"></option>
      </select>
    </div>
  </div>

  <div id="list"></div>
  <div id="music" hidden></div>
  <div id="editTab" hidden></div>
  <div class="empty" id="empty" hidden></div>
  <p class="foot" id="foot"></p>
</div>

<div class="dock">
  <div class="mini" id="mini" hidden>
    <span class="art" id="miniArt" hidden></span>
    <button class="icon-btn play-s" id="miniPlay" type="button" data-ta="play"></button>
    <button class="mini-info" id="miniOpen" type="button"><b id="miniTitle"></b><span class="tc" id="miniTime"></span><span class="mini-bar"><i id="miniBar"></i></span></button>
    <button class="icon-btn" id="miniNext" type="button" data-ta="next" hidden></button>
    <button class="icon-btn" id="miniClose" type="button" data-ta="closePlayer"></button>
  </div>
  <button class="fab" id="recBtn" type="button" data-ta="newRec"><span></span></button>
</div>

<!-- collection: album / artist / folder -->
<section class="sheet" id="coll" hidden>
  <div class="sheet-inner">
    <div class="sheet-head"><button class="icon-btn" id="collBack" type="button" data-ta="back"></button></div>
    <div id="collBody"></div>
  </div>
</section>

<!-- recorder -->
<section class="sheet rec-sheet" id="recSheet" hidden data-state="idle">
  <div class="sheet-inner">
    <div class="sheet-head">
      <button class="icon-btn" id="recClose" type="button" data-ta="close"></button>
      <span class="spacer"></span>
      <div class="seg" id="modeSeg" role="radiogroup" data-ta="recType">
        <button type="button" role="radio" data-mode="voice" aria-checked="true" data-t="modeVoice"></button>
        <button type="button" role="radio" data-mode="music" aria-checked="false" data-t="modeMusic"></button>
      </div>
      <span class="spacer"></span>
      <span style="width:44px"></span>
    </div>
    <p class="mode-hint" id="modeHint"></p>
    <div class="stage">
      <div class="rec-state"><span class="led"></span><span id="recStateText"></span></div>
      <div class="timecode" id="recTime">0:00<small>,0</small></div>
      <div class="meter"><span id="recPeak">−∞ dB</span><span class="mk" id="recMarkCount" hidden></span></div>
      <canvas class="live" id="liveWave"></canvas>
    </div>
    <div class="rec-controls">
      <button class="ctl-s mk" id="recMark" type="button" disabled style="justify-self:end"><span class="rnd" id="recMarkIc"></span><span data-t="mark"></span></button>
      <button class="rec-main" id="recMain" type="button"><span class="dot"></span></button>
      <button class="ctl-s" id="recDone" type="button" disabled style="justify-self:start"><span class="rnd" id="recDoneIc"></span><span data-t="done"></span></button>
    </div>
    <p class="rec-foot" id="recFoot"></p>
  </div>
</section>

<!-- player -->
<section class="sheet" id="player" hidden>
  <div class="sheet-inner">
    <div class="sheet-head">
      <button class="icon-btn" id="plBack" type="button" data-ta="back"></button>
      <span class="spacer"></span>
      <button class="icon-btn" id="plEdit" type="button" data-ta="edit" hidden></button>
      <button class="icon-btn" id="plFav" type="button" data-ta="fav" aria-pressed="false"></button>
    </div>
    <div class="pl-id">
      <span class="art" id="plArt" hidden></span>
      <div class="pl-id-txt">
        <input class="pl-title" id="plTitle" data-ta="titleLabel" maxlength="120" autocomplete="off">
        <div class="pl-meta" id="plMeta"></div>
      </div>
    </div>
    <div class="pl-row" id="plCatRow">
      <label class="cat-pick" id="plCatWrap"><i></i><select id="plCat" data-ta="category"></select></label>
    </div>
    <div class="clock" id="plClock">00:00<small>,00</small></div>
    <div class="scroll-box">
      <canvas class="scroll-wave" id="plScroll" data-ta="waveAria"></canvas>
      <div class="zoom"><button type="button" id="zoomOut" data-ta="zoomOut">−</button><button type="button" id="zoomIn" data-ta="zoomIn">+</button></div>
      <div class="wave-status" id="waveStatus" hidden></div>
    </div>
    <canvas class="overview" id="plOverview" data-ta="overviewAria"></canvas>
    <div class="pl-times tc"><span id="plCur">0:00</span><span id="plDur">0:00</span></div>
    <div class="transport">
      <button class="ctl ghost" id="plPrev" type="button" data-ta="prev" hidden></button>
      <button class="ctl" id="plB10" type="button" data-ta="back10"></button>
      <button class="play" id="plPlay" type="button" data-ta="play"></button>
      <button class="ctl" id="plF10" type="button" data-ta="fwd10"></button>
      <button class="ctl ghost" id="plNext" type="button" data-ta="next" hidden></button>
    </div>
    <div class="tools">
      <button class="tool" id="plSpeed" type="button" data-ta="speed"><span class="tc">1×</span></button>
      <button class="tool" id="plShuffle" type="button" aria-pressed="false" hidden></button>
      <button class="tool" id="plRepeat" type="button" aria-pressed="false" hidden></button>
      <button class="tool mark" id="plMark" type="button"></button>
      <button class="tool" id="plEdit2" type="button" hidden></button>
    </div>
    <section class="block">
      <h2><span data-t="bookmarks"></span> <span class="n" id="bmCount"></span></h2>
      <ol class="bms" id="bmList"></ol>
      <p class="hint" id="bmEmpty" data-t="bmEmpty"></p>
    </section>
    <section class="block">
      <h2 data-t="notes"></h2>
      <textarea id="plNotes" rows="5" data-tp="notesPh"></textarea>
      <p class="saved" id="notesSaved"></p>
    </section>
    <section class="block" id="textBlock" hidden>
      <h2 data-t="textTitle"></h2>
      <div id="textBody"></div>
    </section>
    <div class="pl-actions">
      <button class="btn" id="plCopy" type="button"></button>
      <button class="btn" id="plShare" type="button"></button>
      <span class="spacer"></span>
      <button class="btn danger" id="plDelete" type="button"></button>
    </div>
    <p class="where" id="plWhere"></p>
  </div>
</section>

<div class="modal" id="modal" hidden><div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<input class="vh" type="file" id="importInput" accept="audio/*,.m4a,.mp3,.wav,.ogg,.oga,.opus,.aac,.flac,.amr,.3gp,.webm,.weba,.caf" multiple tabindex="-1" aria-hidden="true">
<input class="vh" type="file" id="captureInput" accept="audio/*" capture tabindex="-1" aria-hidden="true">

  if (!armed) return;
  armed = false;
  const top = stack[stack.length - 1];
  if (top) closeOverlay(top, true);
  if (stack.length) arm();
});
const elOf = n => ({ rec: $('#recSheet'), player: $('#player'), modal: $('#modal'), coll: $('#coll') })[n];
function openOverlay(n) {
  const el = elOf(n);
  if (!stack.includes(n)) stack.push(n);
  el.hidden = false; void el.offsetWidth; el.classList.add('open');
  if (n === 'rec') bars('stage');
  document.body.classList.add('locked');
  arm();
}
function hideEl(el) {
  el.classList.remove('open');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(() => { if (!el.classList.contains('open')) el.hidden = true; }, reduce ? 0 : 260);
}
let modalOnClose = null;
function closeOverlay(n, fromPop) {
  if (n === 'rec' && R.state !== 'idle') { if (fromPop) askCancelRec(); return false; }
  if (n === 'modal' && S.modalLocked) return false;
  const i = stack.indexOf(n); if (i < 0) return false;
  stack.splice(i, 1);
  hideEl(elOf(n));
  if (n === 'rec') bars('page');
  if (n === 'modal') { const f = modalOnClose; modalOnClose = null; if (f) f(); }
  if (n === 'player') onPlayerClosed();
  if (!stack.length) document.body.classList.remove('locked');
  if (!fromPop && !stack.length) disarm();
  updateMini();
  return true;
}
function swapOverlay(from, to) {
  const i = stack.indexOf(from);
  if (i >= 0) stack.splice(i, 1);
  hideEl(elOf(from));
  if (from === 'rec') bars('page');
  openOverlay(to);
}

/* ---------- recordings list ---------- */
function matchRec(r, q) {
  if (norm(r.title).includes(q)) return { kind: 'title' };
  for (const b of r.bookmarks || []) if (norm(b.label).includes(q) || norm(b.note).includes(q)) return { kind: 'bm', b };
  if (norm(r.notes).includes(q)) return { kind: 'note' };
  if ((r.tags || []).some(x => norm(x).includes(q))) return { kind: 'tag' };
  if (norm(r.ttext).includes(q)) return { kind: 'text' };
  const c = catById(r.categoryId); if (c && norm(c.name).includes(q)) return { kind: 'cat' };
  if (norm(r.folder).includes(q)) return { kind: 'folder' };
  return null;
}
function visibleRecs() {
  let r = recItems();
  if (S.filter === 'fav') r = r.filter(x => x.fav);
  else if (S.filter === 'none') r = r.filter(x => !catById(x.categoryId));
  else if (S.filter !== 'all') r = r.filter(x => x.categoryId === S.filter);
  const q = norm(S.q.trim());
  r.forEach(x => { x._hit = null; });
  if (q) r = r.filter(x => (x._hit = matchRec(x, q)));
  const by = {
    new: (a, b) => b.created - a.created,
    old: (a, b) => a.created - b.created,
    long: (a, b) => (b.duration || 0) - (a.duration || 0),
    name: (a, b) => a.title.localeCompare(b.title, LOC)
  }[S.sort] || ((a, b) => b.created - a.created);
  return r.sort(by);
}
function miniWave(r) {
  const pk = r.peaks && r.peaks.length ? downsample(r.peaks, 64) : null;
  if (!pk) return '';
  let bs = '';
  for (let i = 0; i < 64; i++) {
    const v = Math.max(0.08, Math.pow(pk[i], 0.75));
    const h = Math.max(1.4, v * 18);
    bs += `<rect x="${i * 2 + 0.25}" y="${(20 - h) / 2}" width="1.15" height="${h}" rx=".5"/>`;
  }
  let marks = '';
  const d = r.duration || 0;
  if (d) for (const b of r.bookmarks || []) { const x = Math.min(127.4, Math.max(0, b.t / d * 128)); marks += `<rect x="${x}" y="0" width=".9" height="20"/>`; }
  return `<svg class="mini-wave" viewBox="0 0 128 20" preserveAspectRatio="none" aria-hidden="true"><g fill="var(--wave)">${bs}</g><g fill="var(--mark)">${marks}</g></svg>`;
}
function hitLine(r) {
  const h = r._hit; if (!h) return '';
  const q = S.q.trim(); const mk = s => {
    const i = norm(s).indexOf(norm(q)); if (i < 0) return esc(s);
    return esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length));
  };
  if (h.kind === 'bm') return `<span class="hit">${fmt(h.b.t)} · ${mk(norm(h.b.label).includes(norm(q)) ? h.b.label : h.b.note)}</span>`;
  if (h.kind === 'note' || h.kind === 'text') {
    const n = (h.kind === 'note' ? r.notes : r.ttext) || ''; const i = Math.max(0, norm(n).indexOf(norm(q)) - 24);
    return `<span class="hit">${h.kind === 'note' ? esc(t('notePrefix')) + ' ' : ''}${mk((i ? '…' : '') + n.slice(i, i + 90))}</span>`;
  }
  if (h.kind === 'tag') return `<span class="hit">#${mk((r.tags || []).find(x => norm(x).includes(norm(q))))}</span>`;
  return '';
}
const folderOf = s => (s.folder || '').replace(/\/$/, '') || t('phone');
const folderName = f => f.split('/').pop() || f;
const srcLabel = r => (NATIVE && r.src && !r.own) ? `<span class="src">${ic('folder', 1.6)}${esc(folderName(folderOf(r)))}</span>` : '';
function rowHTML(r) {
  const c = catById(r.categoryId);
  const n = (r.bookmarks || []).length;
  let sub = `<span>${dfTime.format(r.created)}</span><span>${fmt(r.duration)}</span>`;
  if (n) sub += `<span class="bmc" aria-label="${esc(t('nMarks', { n }))}">${ic('flag')}${n}</span>`;
  if (c && S.filter !== c.id) sub += `<span class="catlab" style="--c:${c.color}"><i></i>${esc(c.name)}</span>`;
  sub += srcLabel(r);
  if (r.enh) sub += `<span class="enh-dot" title="${esc(t('enhAuto'))}">${ic('spark', 1.6)}</span>`;
  const bz = BUSY.get(r.id);
  if (bz) sub += `<span class="busy-pill" data-busy="${esc(r.id)}">${esc(busyLabel(bz))}</span>`;
  return `<article class="rec${S.cur === r.id && !audio.paused ? ' playing' : ''}">
    <button class="rec-open" type="button" data-open="${esc(r.id)}">
      <span class="rec-top"><span class="rec-title">${esc(r.title)}</span>${r.sample ? `<span class="pill">${esc(t('sample'))}</span>` : ''}</span>
      <span class="rec-sub">${sub}</span>${hitLine(r)}${miniWave(r)}
    </button>
    <button class="fav-btn${r.fav ? ' on' : ''}" type="button" data-fav="${esc(r.id)}" aria-pressed="${!!r.fav}" aria-label="${esc(t('fav'))}">${ic(r.fav ? 'starFill' : 'star')}</button>
  </article>`;
}

/* ---------- export / copy / delete ---------- */
function extFor(r) {
  const m = (r.mime || '').toLowerCase(), f = r.fileName || r.name || '';
  const fe = (f.match(/\.([a-z0-9]{2,5})$/i) || [])[1];
  if (fe) return fe.toLowerCase();
  if (m.includes('webm')) return 'webm';
  if (m.includes('mp4') || m.includes('m4a') || m.includes('aac')) return 'm4a';
  if (m.includes('ogg') || m.includes('opus')) return 'ogg';
  if (m.includes('wav')) return 'wav';
  if (m.includes('mpeg') || m.includes('mp3')) return 'mp3';
  return 'audio';
}
const safeName = s => (s || 'kayit').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80) || 'kayit';
$('#plShare').addEventListener('click', async () => {
  const r = curRec(); if (!r) return;
  if (NATIVE && r.src) { try { AND.share(JSON.stringify(r.src), r.title, (r.mime || '').split(';')[0]); } catch (e) { toast(t('shareFail')); } return; }
  const rec = await db.get('blobs', r.id).catch(() => null); if (!rec) return toast(t('noAudio'));
  const ext = extFor(r);
  const name = safeName(r.title) + '.' + ext;
  if (!IN_FRAME && navigator.canShare) {
    try {
      const file = new File([rec.blob], name, { type: (rec.blob.type || r.mime || '').split(';')[0] });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: r.title }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  if (IN_FRAME && window.claude && window.claude.use) {
    let dl = null; try { dl = await window.claude.use('downloads'); } catch (e) {}
    if (!dl) return toast(t('noDownload'));
    const saveName = ext === 'm4a' ? safeName(r.title) + '.mp4' : name;
    try { await dl.save({ filename: saveName, data: rec.blob }); toast(t('fileSaved')); }
    catch (e) {
      if (e && e.code === 'declined') return;
      if (e && e.code === 'rejected_extension') toast(t('extBlocked', { ext }), 4200);
      else toast(t('dlFail'));
    }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(rec.blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
});

function setBusy(id, kind, p) {

async function studioJob(kind, it, args) {

  let last = 0;
  try {
    return await runJob(kind, Object.assign({ src: it.src }, args), f => { const now = Date.now(); if (now - last > 400 || f >= 1) { last = now; setBusy(it.id, kind, f); } });
  } finally { setBusy(it.id); }
}

/* the user's voice: average tone of their last enhanced speech recordings */
async function voiceProfiles() { const v = await db.get('kv', 'voiceProfiles').catch(() => null); return (v && v.list) || []; }
async function learnedProfile() {
  const l = await voiceProfiles();
  if (l.length < 3) return null;
  const n = l[0].length, out = new Array(n).fill(0);
  for (const p of l) for (let i = 0; i < n; i++) out[i] += p[i] / l.length;
  return out;
}
async function addVoiceProfile(tone) {
  if (!tone || !tone.length) return;
  const l = await voiceProfiles();
  l.push(tone); while (l.length > 10) l.shift();
  await db.put('kv', { k: 'voiceProfiles', list: l }).catch(() => {});
}

(() => {

    if (cv.id === 'wsNav') { nav = true; wsNavMove(cv, e); return; }

      const want = Math.floor(el * LR);
      while (R.levels.length < want) { R.levels.push(R.curMax); R.curMax = 0; }
      if (!R.native && performance.now() - R.lastSave > 10000) saveDraft();
    }
    showRecTime(el);
    const lvl = m > 0 ? 20 * Math.log10(m) : -Infinity, now = performance.now();
    if (lvl > R.peakDb || now - R.peakAt > 900) { R.peakDb = lvl; R.peakAt = now; }
    if (++frame % 4 === 0) {
      $('#recPeak').innerHTML = m >= 0.995 ? '<span class="clip">CLIP 0 dB</span>' : (R.peakDb < -60 || !isFinite(R.peakDb) ? '−∞ dB' : `${Math.round(R.peakDb).toString().replace('-', '−')} dB`);
    }
    drawLive();
  };
  tick();
}
function drawLive() {
  const cv = $('#liveWave'); if ($('#recSheet').hidden) return;
  const c = sizeCanvas(cv); if (!c) return;
  const { ctx, w, h } = c;
  ctx.fillStyle = COL.sLine; ctx.fillRect(0, h / 2 - 0.5, w, 1);
  const bw = 3, gap = 2, step = bw + gap, L = R.levels;
  const n = Math.floor(w / step), right = w - 6;
  const nb = Math.floor(L.length / 2), start = Math.max(0, nb - n); // two values per bar: ten bars a second
  ctx.fillStyle = COL.sInk;
  for (let i = start; i < nb; i++) {
    const v0 = Math.max(L[i * 2] || 0, L[i * 2 + 1] || 0);
    const x = right - (nb - i) * step;
    const v = Math.min(1, Math.pow(v0, 0.6) * 1.1), bh = Math.max(2, v * (h - 12));
    rr(ctx, x, (h - bh) / 2, bw, bh, 1.5);
  }
  ctx.fillStyle = COL.sMark;
  for (const mk of R.marks) { const i = Math.floor(mk.t * LR / 2); if (i < start) continue; const x = right - (nb - i) * step; ctx.fillRect(x, 0, 2, h); }
  if (R.state === 'rec' || R.state === 'paused') { ctx.fillStyle = R.state === 'rec' ? COL.sRec : COL.sMark; ctx.fillRect(right + 1, 6, 2, h - 12); }
}

/* ---------- import ---------- */
async function importFiles(fileList, source) {
  const files = [...fileList].filter(f => f && f.size > 0);
  if (!files.length) return null;
  toast(files.length > 1 ? t('adding', { n: files.length }) : t('addingOne'), 0);
  let first = null, bad = 0, failed = 0;
  for (const f of files) {
    try {
      const info = await analyze(f);
      if (!info.ok) bad++;
      const now = Date.now();
      const rec = { id: uid(), title: source === 'phone' ? defaultTitle('voice', now) : (f.name.replace(/\.[^.]+$/, '') || t('importedTitle')), userTitle: true,
        created: source === 'phone' ? now : (f.lastModified && f.lastModified < now + 6e4 ? f.lastModified : now),
        duration: info.duration || 0, mime: f.type || '', size: f.size, categoryId: defaultCat(), notes: '', bookmarks: [],
        peaks: info.lv ? downsample(info.lv, 240) : null, source: source || 'import', fav: false, fileName: f.name, kind: 'rec' };
      const data = f.size < 300e6 ? new Blob([await f.arrayBuffer()], { type: f.type || '' }) : f;
      await db.put('blobs', { id: rec.id, blob: data }); await db.put('recordings', rec);
      if (info.lv) await storePeaks(rec.id, toBytes(info.lv), LR);
      S.items.set(rec.id, rec); if (!first) first = rec;
    } catch (e) { failed++; }
  }
  render();
  if (!IN_FRAME && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  const added = files.length - failed;
  if (failed && !added) toast(t('addFail'), 4200);
  else if (bad) toast(t('addedBad', { n: added, b: bad }), 4200);
  else toast(t('added', { n: added }));
  return first;
}

// files shared into the app or picked: the phone copies them into Music/Ses Defteri
window.__sdImported = async () => {
  if (!NATIVE || !booted) return;
  let batches = []; try { batches = JSON.parse(AND.takeImported() || '[]'); } catch (e) {}
  if (!batches.length) return;
  let first = null, n = 0, failed = 0;
  for (const b of batches) {
    failed += b.failed || 0;
    for (const raw of b.items || []) {
      const it = fromNative(raw, null);
      it.kind = 'rec'; it.source = 'import'; it.created = Date.now(); it.categoryId = defaultCat();
      S.items.set(it.id, it); await saveRec(it); n++; if (!first) first = it;
    }
  }
  if (n) { S.tab = 'rec'; ls.set('tab', 'rec'); }
  render();
  if (n) toast(t('filesAdded', { n })); else if (failed) toast(t('fileAddFail'));
  if (first && n === 1) openPlayer(first.id);
  scheduleBackground();
};

/* ---------- sample content (browser version) ---------- */
function encodeWav(ab) {
  const d = ab.getChannelData(0), sr = ab.sampleRate; let mx = 1e-4;
  for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > mx) mx = v; }
  const g = 0.89 / mx, n = d.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); ws(8, 'WAVE'); ws(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) { const s = Math.max(-1, Math.min(1, d[i] * g)); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  return new Blob([buf], { type: 'audio/wav' });
}
async function makeSample() {
  if (!OAC) return null;
  const sr = 22050, len = 22;
  const oc = new OAC(1, sr * len, sr);
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const tone = (m, t0, dur, gain, type) => {
    const o = oc.createOscillator(), g = oc.createGain();
    o.type = type || 'triangle'; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(gain, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    o.connect(g); g.connect(oc.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  };
  const chords = [[57, 60, 64], [53, 57, 60], [48, 55, 64], [55, 59, 62]];
  const bar = 2.4;
  for (let b = 0; b < 8; b++) {
    const ch = chords[b % 4], t0 = b * bar, loud = b >= 4 ? 0.2 : 0.12;
    tone(ch[0] - 12, t0, bar * 0.95, loud * 1.1, 'sine');
    const arp = [0, 1, 2, 1, 2, 1, 0, 1];
    arp.forEach((k, i) => tone(ch[k] + (i === 4 ? 12 : 0), t0 + i * bar / 8, 0.55, loud * 0.8));
  }
  const beat = bar / 4;
  const mel = [[0, 76, 1], [1, 74, .5], [1.5, 72, 1.5], [3, 72, 1], [4, 71, .5], [4.5, 74, 1.5], [6, 72, .75], [6.75, 71, .5], [7.25, 69, .75]];
  for (const [start, gain] of [[2 * bar, 0.18], [6 * bar, 0.26]]) for (const [b, m, d] of mel) tone(m, start + b * beat, d * beat * 1.6, gain, 'sine');
  tone(57, 8 * bar, 2.6, 0.24, 'sine'); tone(64, 8 * bar, 2.6, 0.14, 'triangle'); tone(69, 8 * bar, 2.6, 0.12, 'sine');
  const ab = await new Promise((res, rej) => {
    oc.oncomplete = e => res(e.renderedBuffer);
    const p = oc.startRendering(); if (p && p.then) p.then(res, rej);
  });
  return { blob: encodeWav(ab), lv: peaks20(ab), duration: ab.duration };
}
async function seed() {
  const cats = [
    { id: 'c-muzik', name: t('catSeedMusic'), color: CAT_COLORS[2], created: Date.now() },

/* ---------- recovery (browser recorder) ---------- */
async function recoverDraft() {
  const d = await db.get('kv', 'draft').catch(() => null); if (!d) return;
  const lo = d.id + ':', hi = d.id + ':￿';
  const parts = await db.range('chunks', lo, hi).catch(() => []);
  if (parts.length && !S.items.has(d.id)) {
    let blob = new Blob(parts.map(p => p.blob), { type: d.mime || 'audio/webm' });
    const url = URL.createObjectURL(blob); let dur = await probeDuration(url); URL.revokeObjectURL(url);
    if (!dur) dur = d.dur || 0;
    if (/webm/i.test(d.mime || '') && window.ysFixWebmDuration && dur) { try { blob = await window.ysFixWebmDuration(blob, dur * 1000, { logger: false }); } catch (e) {} }
    const rec = { id: d.id, title: t('recovered', { d: `${dfShort.format(d.started)} ${dfTime.format(d.started)}` }), userTitle: true, created: d.started, duration: dur, mime: d.mime, size: blob.size,
      categoryId: d.cat && catById(d.cat) ? d.cat : null, notes: '', bookmarks: d.marks || [], peaks: d.levels || null, source: 'mic', mode: d.mode, fav: false, kind: 'rec' };
    try {
      await db.put('blobs', { id: rec.id, blob }); await db.put('recordings', rec);
      S.items.set(rec.id, rec); toast(t('recoveredToast'), 4000);
    } catch (e) { return; }
  }
  await db.delRange('chunks', lo, hi).catch(() => {}); await db.del('kv', 'draft').catch(() => {});
}

/* ---------- moving 1.0 recordings (kept inside the app) into Music/Ses Defteri ---------- */
function blobToB64(b) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = () => rej(fr.error); fr.readAsDataURL(b); });
}
async function migrateLegacy() {
  if (!NATIVE) return;
  const legacy = [...S.items.values()].filter(it => !it.src);
  if (!legacy.length) return;
  let moved = 0, i = 0;
  for (const old of legacy) {
    i++;
    const b = await db.get('blobs', old.id).catch(() => null);
    if (old.sample || !b || !b.blob) { await forgetItem(old.id); continue; }
    toast(t('migrate', { i, n: legacy.length }), 0);
    try {
      const ext = extFor(old) === 'audio' ? 'webm' : extFor(old);
      const tok = AND.beginFile(safeName(old.title) + '.' + ext, (b.blob.type || old.mime || '').split(';')[0]);
      if (!tok) throw new Error('open');
      const CH = 768 * 1024;
      for (let o = 0; o < b.blob.size; o += CH) { if (!AND.appendFile(tok, await blobToB64(b.blob.slice(o, o + CH)))) throw new Error('write'); }
      const res = await runJob('commit', { token: tok, name: safeName(old.title), ext, mime: (b.blob.type || '').split(';')[0] });
      const it = fromNative(res, null);
      Object.assign(it, { title: old.title, userTitle: true, created: old.created, notes: old.notes || '', bookmarks: old.bookmarks || [],
        categoryId: old.categoryId || null, fav: !!old.fav, peaks: old.peaks, source: old.source, mode: old.mode, kind: 'rec' });
      if (!it.duration) it.duration = old.duration;
      S.items.set(it.id, it); await saveRec(it);
      const pk = await db.get('peaks', old.id).catch(() => null);
      if (pk) { await storePeaks(it.id, pk.data, pk.rate); storedPeakIds.add(it.id); }
      await forgetItem(old.id);
      moved++;
    } catch (e) { /* keep the old copy; try again on the next start */ }
  }
  hideToast();
  if (moved) toast(t('migrated', { n: moved }), 3500);
}
